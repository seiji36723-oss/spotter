      const kept = { v: 5, id: "s" + endedAt.toString(36), date: formatDateISO(new Date(startedAt)), type: cur.type === "off" ? "home" : cur.type === "strength" ? "strength" : "cardio", day: cur.day, interval: !!cur.interval, startedAt, endedAt, items };
      if (validSession(kept)) { logs.push(kept); saveLogs(); }
    }
    cur = null;
  }

  // ── 前回を少しでも上回る目標 ──
  // 前回の全セットが目標回数の上限に届いた → 1段階重く。届かなかった → 同じ重さで合計1回（プランクは5秒）でも多く
  function target(ex, nSets) {
    const [lo, hi] = ex.range;
    const step = ex.step || 1;
    const u = ex.unit === "sec" ? "秒" : "回";
    const inc = ex.unit === "sec" ? 5 : 1;
    const snap = (w) => Math.max(step, Math.floor(w / step + 1e-9) * step);
    const h = perfHistory(ex.id, 1)[0];
    const mk = (w, reps, text, up = false) => ({ w, reps: Array.from({ length: nSets }, (_, j) => reps[Math.min(j, reps.length - 1)]), text, up });
    if (!h) {
      const r0 = ex.unit === "sec" ? 20 : ex.part === "abs" ? 12 : ex.acc ? 12 : Math.max(lo, Math.min(10, hi - 2));
      return weighted(ex)
        ? mk(ex.start, [r0], `初めて：<b>${fmtKg(ex.start)}kg</b> × ${r0}${u} から`)
        : mk(null, [ex.unit === "sec" ? 20 : 10], "初めて：できる範囲で。フォームを優先");
    }
    const last = h.it.sets;
    const lastR = last.map((x) => x.r || 0);
    const lastW = weighted(ex) ? Math.max(...last.map((x) => x.w || 0)) || null : null;
    const ld = lastDay();
    const gap = ld ? daysBetween(ld, todayIso()) : 0;
    const repStr = lastR.join("・") + u;
    const wStr = lastW != null ? `${fmtKg(lastW)}kg × ` : "";
    if (gap >= 14) {
      const w = lastW != null ? Math.max(step, Math.min(snap(lastW * 0.85), lastW - step)) : null;
      return mk(w, [ex.unit === "sec" ? Math.max(20, Math.min(...lastR)) : lo + 2], `${gap}日ぶり：前回 ${wStr}${repStr} → ${w != null ? `<b>${fmtKg(w)}kg</b> に軽くして` : "少なめで"}体を慣らす`);
    }
    if (lastW != null && last.length >= Math.min(nSets, 3) && lastR.every((r) => r >= hi)) {
      const w = lastW + step;
      return mk(w, [lo], `前回 ${wStr}${repStr} 全部${hi}${u} → <b>${fmtKg(w)}kg</b> に上げて${lo}${u}以上`, true);
    }
    // 同じ重さで、いちばん少なかったセットを少し増やす
    const reps = Array.from({ length: nSets }, (_, j) => Math.min(hi, lastR[Math.min(j, lastR.length - 1)]));
    const k = reps.indexOf(Math.min(...reps));
    if (reps[k] < hi || !weighted(ex)) reps[k] += inc;
    const total = reps.reduce((a, r) => a + r, 0);
    return mk(lastW, reps, `前回 ${wStr}${repStr} → 今日は<b>合計${total}${u}</b>以上`);
  }

  // ── 今日のメニューを作る ──
  // 1つの枠（部位）の種目を選ぶ：使える器具で、昨日やっていない（連続日のとき）、今日のほかの枠と重ならないもの
  function pickFor(slot, avoid, taken) {
    const cands = slot.ex.map((id) => EX[id]).filter((e) => usable(e) && !taken.has(e.id));
    return cands.find((e) => !avoid.has(e.id)) || cands[0] || null;
  }
  function makeItem(ex0, part, role, nSets, optional) {
    const rng = course().range;
    const ex = rng && weighted(ex0) && !ex0.acc && ex0.part !== "abs" ? { ...ex0, range: rng } : ex0; // コースの回数の目安を使う
    const t = target(ex, nSets);
    return {
      exId: ex.id, part, role, optional: !!optional,
      rx: { unit: ex.unit, lo: ex.range[0], hi: ex.range[1] },
      sug: { text: t.text, up: t.up },
      sets: t.reps.map((r) => ({ w: t.w, r, t: r, done: false })), // t：そのセットの目標回数
    };
  }
  // 有酸素：速さはこちらで指示、時間は目安（lo〜hi分）を出して本人が入れる
  function cardioItem(range, role, exId) {
    const ex = exId ? EX[exId] : CARDIO_EX.map((id) => EX[id]).find(usable) || EX.home_walk;
    return { exId: ex.id, part: "cardio", role, rx: { unit: "min", lo: range[0], hi: range[1] }, sets: [{ m: range[0], done: false }] };
  }
  // 筋トレの時間の見積もり（分）：準備5分＋（1セット＋休憩）×セット数
  const strengthMinutes = (items) => 5 + items.filter((it) => it.part !== "cardio").reduce((a, it) => a + it.sets.length * (MIN_PER[EX[it.exId].kind] || 3), 0);
  function makeCur(override) {
    const today = todayIso();
    const auto = planFor(today);
    const type = override || auto.type;
    const notes = [];
    let items = [];
    let key = null;
    let mode = null;
    let why = override ? `手で「${DAY_TYPES[type]}」に変更中` : auto.why;
    if (type === "strength") {
      const sm = strengthMode(today);
      mode = sm.mode;
      if (override) why = sm.why;
      key = nextKey();
      const menu = course().menus[key];
      const taken = new Set();
      menu.slots.forEach((slot) => {
        const ex = pickFor(slot, new Set(), taken);
        if (!ex) { notes.push(`${PART_NAMES[slot.part]}：使える器具の種目がないので省略`); return; }
        taken.add(ex.id);
        items.push(makeItem(ex, slot.part, slot.part === "abs" ? "abs" : "main", slot.sets));
      });
      // 筋トレ後の有酸素。時間が足りない日は休憩ではなく、有酸素→腹筋の順に削る
      const limit = settings.minutes + 5;
      const room = Math.floor((limit - strengthMinutes(items)) / 5) * 5;
      if (!menu.cardio) { /* 筋トレ後の有酸素なし */ } else if (room < menu.cardio[0]) {
        notes.push(`${settings.minutes}分に収めるため、筋トレ後の有酸素は省略`);
        const abs = items.find((it) => it.role === "abs");
        const absBase = abs ? abs.sets.length : 0;
        while (abs && abs.sets.length > 1 && strengthMinutes(items) > limit) abs.sets.pop();
        if (abs && strengthMinutes(items) > limit) { items = items.filter((it) => it !== abs); notes.push("腹筋も省略"); }
        else if (abs && abs.sets.length < absBase) notes.push(`腹筋は${abs.sets.length}セットに`);
      } else items.push(cardioItem([menu.cardio[0], Math.min(menu.cardio[1], room)], "cardio"));
    } else if (type === "cardio") {
      items.push(cardioItem(course().cardioDay, "cardio-day"));
    } else if (type === "off") {
      const n = HOME_SETS[settings.course] || 2;
      HOME_MENU.forEach(([id, part]) => items.push(makeItem(EX[id], part, part === "abs" ? "abs" : "main", n)));
      items.push(cardioItem([15, 20], "home", "stepping"));
    }
    const optional = !override && type === "cardio" && !!auto.optional; // 疲れていなければやる日
    return { ver: 6, course: settings.course, gym: settings.gym, date: today, createdAt: Date.now(), startedAt: null, type, override: override || null, optional, skip: (!override && auto.skip) || null, why, day: key, mode, items, notes, intervalOK: type === "cardio" && intervalOK(today), interval: false };
  }

  const anyDone = () => !!cur && cur.items.some((it) => it.sets.some((x) => x.done));
  const itemDone = (it) => it.sets.length > 0 && it.sets.every((x) => x.done);
  const curSets = () => cur.items.reduce((a, it) => a + (it.part === "cardio" ? 0 : it.sets.length), 0);
  const cardioMin = () => cur.items.filter((it) => it.part === "cardio").reduce((a, it) => a + it.sets[0].m, 0);
  const menuMinutes = () => Math.round((cur.type === "strength" ? strengthMinutes(cur.items) : 0) + cardioMin());

  // ── 記録して終える ──
  function sessionOf(c, endedAt) {
    const items = c.items.map((it) => ({
      exId: it.exId,
      unit: it.rx.unit,
      sets: it.sets.filter((x) => x.done).map((x) => (it.rx.unit === "min" ? (SPEED_CTL[it.exId] ? { m: x.m, sp: Object.fromEntries(SPEED_CTL[it.exId].map((c) => [c.l, spValue(it, c)])) } : { m: x.m }) : { w: x.w, r: x.r })),
    })).filter((it) => it.sets.length);
    const startedAt = c.startedAt || c.createdAt;
    const type = c.type === "off" ? "home" : c.type === "strength" ? "strength" : "cardio";
    return { v: 5, id: "s" + endedAt.toString(36), date: formatDateISO(new Date(startedAt)), type, day: c.day, interval: !!c.interval, startedAt, endedAt, items };
  }
  // 今日のメニューを用意する。前の日に途中まで記録して終えていなければ、その日の分として保存
  const KEEP_MS = 3 * 3600e3; // 記録中とみなす時間（最後に完了を押してから）
  function ensureToday() {
    const today = todayIso();
    if (cur && cur.date !== today) {
      // 0時をまたいでも、記録中ならそのまま続ける（記録は始めた日の分になる）
      if (anyDone() && cur.lastAt && Date.now() - cur.lastAt < KEEP_MS) return;
      if (anyDone()) {
        // 終わりの時刻は、最後に完了を押した時刻（なければ見積もり）
        const started = cur.startedAt || cur.createdAt;
        logs.push(sessionOf(cur, cur.lastAt || started + Math.max(10, menuMinutes()) * 60000));
        saveLogs();
      }
      cur = null;
      showAgain = false;
    }
    if (!cur) { cur = makeCur(null); saveCur(); }
  }
  function rebuild(override) {
    cur = makeCur(override === undefined ? (cur && cur.override) : override);
    pendingRegen = null;
    saveCur();
  }
  function finishSession() {
    if (!anyDone()) { toast("1つ以上「完了」にすると記録できます"); return; }
    const session = sessionOf(cur, Date.now());
    logs.push(session);
    saveLogs();
    lastSummary = session;
    selDay = session.date;
    calMonth = null;
    cur = null;
    showAgain = false;
    ensureToday();
    switchTab("log");
  }
  // 別の種目に入れ替え（同じ部位の、使える種目を順番に）
  function swapItem(i) {
    const it = cur.items[i];
    const ex = EX[it.exId];
    const pool = it.part === "cardio" ? CARDIO_EX.map((id) => EX[id]).filter(usable)
      : [...new Set(Object.values(course().menus).flatMap((m) => m.slots).filter((s) => s.part === it.part).flatMap((s) => s.ex))]
        .map((id) => EX[id]).filter((e) => usable(e) && (e.id === ex.id || !cur.items.some((x) => x.exId === e.id)));
    if (pool.length < 2) { toast(`ほかに入れ替えられる${PART_NAMES[it.part]}の種目がありません`); return; }
    const next = pool[(pool.findIndex((e) => e.id === ex.id) + 1) % pool.length];
    cur.items[i] = it.part === "cardio" ? { ...it, exId: next.id } : makeItem(next, it.part, it.role, it.sets.length, it.optional);
    saveCur();
    renderMenu();
    toast(`${ex.name} → ${next.name}`);
  }

  // ── アドバイス（体重と重さの変化から） ──
  function advice() {
    const out = [];
    // 2〜3週間、体重が変わらない → 有酸素を週1回増やすか食事を見直す
    const b = body.filter((r) => r.weight != null).sort((x, y) => (x.date < y.date ? -1 : 1));
    if (b.length >= 2) {
      const last = b[b.length - 1];
      const past = b.filter((r) => daysBetween(r.date, last.date) >= 14 && daysBetween(r.date, last.date) <= 24).pop();
      if (past) {
        const n = daysBetween(past.date, last.date);
        const dw = last.weight - past.weight;
        if (Math.abs(dw) < 0.3) out.push({ kind: "warn", text: `${n}日間、体重が変わっていません → 有酸素を週1回増やすか、食事を見直しましょう` });
        else if (dw <= -0.5) out.push({ kind: "good", text: `体重 ${fmtKg(dw)}kg（${n}日前より）` });
      }
    }
    // メイン種目の重さが落ちてきた → 有酸素を減らす
    const drops = [];
    EXERCISES.filter((e) => !e.old && weighted(e) && e.part !== "abs" && !e.acc).forEach((e) => {
      const h = perfHistory(e.id, 4);
      if (h.length < 3) return;
      const best = (x) => Math.max(...x.it.sets.map((s) => s.w || 0));
      const now = best(h[0]);
      const before = Math.max(...h.slice(1).map(best));
      if (now < before - 1e-6) drops.push(e.name);
    });
    if (drops.length >= 2) out.push({ kind: "warn", text: `重さが落ちてきています（${drops.slice(0, 3).join("・")}）→ 有酸素の量を減らしましょう` });
    return out;
  }

  // ── 音・振動・通知（右のタイマーと早歩きで使う） ──
  let audioCtx = null;
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) { audioCtx = null; }
  }
  function beep(n = 2) {
    if (!audioCtx) return;
    try {
      for (let k = 0; k < n; k++) {
        const t0 = audioCtx.currentTime + k * 0.25;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0);
        o.stop(t0 + 0.2);
      }
    } catch (e) { /* 鳴らせなくても続ける */ }
  }
  // 通知（許可されている時だけ）。アプリ版はサービスワーカー経由で出す
  function notify(title, text) {
    try {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then((r) => r.showNotification(title, { body: text, icon: "icons/icon-192.png", tag: "spotter" })).catch(() => {});
      } else new Notification(title, { body: text, tag: "spotter" });
    } catch (e) { /* 通知できなくても続ける */ }
  }
  function alarm(title, text) {
    beep(3);
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { /* 対応していない端末 */ }
    if (document.hidden) notify(title, text);
  }
  const fmtSec = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  // ── いつでも使えるタイマー（0から数える。total>0 ならカウントダウンもできるしくみは残す） ──
  const $$ = (q) => Array.from(document.querySelectorAll(q));
  // ボタンの絵（文字の代わり）
  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.2v13.6L19 12z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>';
  const ICON_WATCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg>';
  const ft = { total: 0, acc: 0, since: 0, id: 0, rang: false };
  const ftRunning = () => ft.since > 0;
  const ftElapsed = () => ft.acc + (ftRunning() ? (Date.now() - ft.since) / 1000 : 0);
  function ftTick() {
    if (pkTick()) return; // プランクを計っている間は、そちらが右上に出す
    const e = ftElapsed();
    const show = ft.total ? Math.max(0, Math.ceil(ft.total - e)) : Math.floor(e);
    const tm = $("#ftTime");
    if (tm) tm.textContent = fmtSec(show);
    $("#ftPill").classList.toggle("run", ftRunning());
    const go = $("#ftGo");
    go.innerHTML = ftRunning() ? ICON_PAUSE : ICON_PLAY;
    go.setAttribute("aria-label", ftRunning() ? "タイマーを止める" : "タイマーをスタート");
    if (ft.total && ftRunning() && e >= ft.total) { // 時間になった
      ft.acc = ft.total; ft.since = 0; ft.rang = true;
      clearInterval(ft.id);
      alarm("タイマー", "時間になりました");
      ftTick();
    }
  }
  function ftGo() {
    if (pkOn()) { pkToggle(); return; } // プランク計測中の ❚❚／▶ は、一時停止と再開
    if (ftRunning()) { ft.acc = ftElapsed(); ft.since = 0; clearInterval(ft.id); }
    else {
      if (ft.total && ft.acc >= ft.total) ft.acc = 0;
      ft.rang = false; ft.since = Date.now();
      clearInterval(ft.id); ft.id = setInterval(ftTick, 250);
    }
    ftTick();
  }
  function ftReset() { clearInterval(ft.id); ft.acc = 0; ft.since = 0; ft.rang = false; ftTick(); }
  // ── 秒で数える種目（プランク）の連続計測：▶ を押すと、残りのセットを「準備3秒 → セット → 休憩 → …」と続けて計る ──
  // cur.pk = { exId, js:[セット番号], secs:[セットの秒], rs:休憩の秒, t0:始めた時刻（一時停止した分だけ後ろへずらす）, pausedAt:止めた時刻（0なら動いている）, ack:[押して消した光のセット番号] }
  // 段階・何セット目か・光らせるセットは、t0 と pausedAt から Date.now() で毎回計算する。時間が流れるだけでは cur を保存しない
  // （古いタブが、別のタブの「完了」などを上書きしないため）。保存するのは ▶・❚❚・↺・完了など、人が押した操作のときだけ
  const PK_PREP = 3;
  let pkId = 0, pkLive = false, pkWake = null, pkAudioPrev = null, pkBeepKey = "", pkDead = "", pkNeedTap = false;
  let pkSeen = { key: "", n: 0, at: 0 }; // このタブで見た：どの計測か・終わったセットの数・最後に見た時刻
  const pkOk = (p) => {
    const num = (v, lo, hi) => Number.isFinite(v) && v >= lo && v <= hi;
    return !!p && typeof p === "object" && typeof p.exId === "string" && Array.isArray(p.secs) && Array.isArray(p.js)
      && p.secs.length >= 1 && p.secs.length <= 30 && p.js.length === p.secs.length
      && p.secs.every((v) => num(v, 1, 3600)) && p.js.every((v) => Number.isInteger(v) && v >= 0)
      && num(p.rs, 1, 3600) && Number.isFinite(p.t0) && Number.isFinite(p.pausedAt) && p.pausedAt >= 0;
  };
  const pkKey = (p) => `${p.exId}:${p.t0}`;
  const pkSegs = (secs, rs, tr) => secs.flatMap((len, k) => [{ ph: "prep", k, len: PK_PREP }, { ph: "set", k, len }].concat(k < secs.length - 1 || tr ? [{ ph: "rest", k, len: rs }] : [])); // tr：先のセットを外して、いまの休憩が最後になった
  // いまの段階を時刻から出す（保存はしない）。いまの種目にあるセットだけを数える（−セットで減ったら、計る残りも減る）
  function pkCalc(p, it, now) {
    const js = [], secs = [];
    p.js.forEach((j, k) => { if (j < it.sets.length) { js.push(j); secs.push(p.secs[k]); } });
    const segs = pkSegs(secs, p.rs, p.tr === true), starts = [];
    segs.reduce((a, g) => (starts.push(a), a + g.len), 0);
    const e = Math.max(0, (Math.min(p.pausedAt || now, now) - p.t0) / 1000);
    let s = 0;
    while (s < segs.length && e >= starts[s] + segs[s].len) s++;
    const upJ = []; let lastEnd = 0;
    for (let q = 0; q < s; q++) if (segs[q].ph === "set") { upJ.push(js[segs[q].k]); lastEnd = p.t0 + (starts[q] + segs[q].len) * 1000; }
    return { p, it, now, js, segs, starts, e, s, fin: s >= segs.length, upJ, lastEnd };
  }
  // 計測の今の状態。使えない（なし・壊れている・種目が外れた・全部完了・時計が戻った）なら null。終わっていれば fin: true
  function pkStage() {
    const p = cur && cur.pk;
    if (!pkOk(p)) return null;
    const it = cur.items.find((x) => x.exId === p.exId);
    const now = Date.now();
    if (!it || itemDone(it) || p.t0 > now || pkDead === pkKey(p)) return null;
    return pkCalc(p, it, now);
  }
  const pkOn = () => { const a = pkStage(); return !!a && !a.fin; };
  // 時間になって、まだ押していないセット（完了ボタンを光らせる）
  function pkUp(it, j) {
    const p = cur && cur.pk;
    if (!pkOk(p) || p.exId !== it.exId || it.sets[j].done || (Array.isArray(p.ack) && p.ack.includes(j))) return false;
    return pkCalc(p, it, Date.now()).upJ.includes(j);
  }
  // 完了ボタンを押した：その光は消す（保存は押した操作のほうでする）
  function pkAck(it, js) {
    const p = cur && cur.pk;
    if (pkOk(p) && p.exId === it.exId) p.ack = [...new Set((Array.isArray(p.ack) ? p.ack : []).filter(Number.isInteger).concat(js))]; // 同じ番号は重ねない
  }
  // 計っているセットの完了を押した：そのセットの残りを打ち切って、すぐ次の段階へ（t0 を前へずらす。最後のセットなら終わり）。
  // 先のセットなら計る対象から外す。前のセット（光っている完了）なら何もしない。保存は押した操作のほうでする
  function pkSkip(it, j) {
    const a = pkStage();
    if (!a || a.fin || a.p.exId !== it.exId) return;
    const k = a.js.indexOf(j), p = a.p, g = a.segs[a.s];
    if (k < 0 || k < g.k || (k === g.k && g.ph === "rest")) return;
    if (k === g.k) { // いま計っているセット：打ち切った分だけ先へ進める（時間切れの音は鳴らさない：開始時刻が変わるので、このタブは「新しい計測」と見て鳴らさない）
      const si = a.segs.findIndex((x) => x.ph === "set" && x.k === k);
      p.t0 -= (a.starts[si] + a.segs[si].len - a.e) * 1000;
      return;
    }
    if (g.ph === "rest" && g.k === k - 1 && k === a.js.length - 1) p.tr = true; // 最後のセットを外す：いまの休憩はそのまま続けて最後にする
    const r = p.js.indexOf(j);
    p.js.splice(r, 1); p.secs.splice(r, 1);
  }
  // 画面が消えないように（対応していない・断られたときは何もしない）
  function pkLock() {
    try {
      const a = pkStage();
      const want = !!a && !a.fin && !a.p.pausedAt;
      if (!want) { if (pkWake) { pkWake.release().catch(() => {}); pkWake = null; } return; }
      if (pkWake || !navigator.wakeLock) return;
      navigator.wakeLock.request("screen").then((w) => {
        if (pkWake || !pkOn() || cur.pk.pausedAt) { w.release().catch(() => {}); return; }
        pkWake = w;
        w.addEventListener("release", () => { if (pkWake === w) pkWake = null; });
      }).catch(() => {});
    } catch (e) { /* 使えなくても続ける */ }
  }
  // 動かす：iPhone の消音スイッチでも鳴るように音の種類を playback に（対応している端末だけ）
  function pkRun() {
    clearInterval(pkId); pkId = 0;
    if (!pkOn()) return;
    pkLive = true;
    if (!cur.pk.pausedAt) {
      try { if (navigator.audioSession && pkAudioPrev === null) { pkAudioPrev = navigator.audioSession.type; navigator.audioSession.type = "playback"; } } catch (e) { /* 対応していない端末 */ }
      pkId = setInterval(pkLoop, 250);
    }
    pkLock();
  }
  // 終わり・やめた：タイマーの後始末（記録は消さない）
  function pkEnd() {
    clearInterval(pkId); pkId = 0; pkLive = false; pkBeepKey = "";
    try { if (pkAudioPrev !== null && navigator.audioSession) navigator.audioSession.type = pkAudioPrev; } catch (e) { /* 対応していない端末 */ }
    pkAudioPrev = null;
    pkLock();
    const pill = $("#ftPill");
    if (pill) pill.classList.remove("pk");
    const hint = $("#ftHint");
    if (hint) hint.hidden = true; // 計っていないときは「タップ」のヒントも隠す
  }
  // 人が止めた（↺・別の種目の ▶）：計っている最中だけ消す。終わって光っているセットはそのまま
  function pkStop() {
    if (pkOn()) { delete cur.pk; saveCur(); }
    const was = pkLive;
    pkEnd();
    if (was) ftTick();
  }
  function pkStart(i) {
    const it = cur.items[i];
    delete cur.pk; pkEnd(); ftReset(); // 右上の「0から数える」はいったん止める
    const js = [], secs = [];
    it.sets.forEach((x, j) => { if (!x.done) { js.push(j); secs.push(Math.max(1, Math.min(3600, Number(x.r) || 20))); } });
    if (!js.length) return;
    cur.pk = { exId: it.exId, js, secs, rs: (REST_SEC[EX[it.exId].kind] || 90) + (it.restExtra || 0), t0: Date.now(), pausedAt: 0, ack: [] };
    pkRun(); pkLoop();
  }
  function pkToggle() {
    const p = cur.pk, now = Date.now();
    if (p.pausedAt) { p.t0 += now - Math.min(p.pausedAt, now); p.pausedAt = 0; unlockAudio(); } else p.pausedAt = now;
    saveCur(); pkRun(); pkLoop();
  }
  const pkLoop = () => { if (!pkTick()) ftTick(); };
  // 右上に出す。計っている間は true（ftTick はそのまま戻る）。ここでは cur を保存しない
  function pkTick() {
    const a = pkStage();
    if (!a) {
      if (pkLive) { pkEnd(); ftTick(); }
      return false;
    }
    const { p, it, now } = a, key = pkKey(p);
    if (pkSeen.key === key && now < pkSeen.at - 2000) { pkDead = key; pkEnd(); return false; } // 時計が戻った：やめた形にして、同じセットで鳴らし直さない
    const first = pkSeen.key !== key;
    const grew = !first && a.upJ.length > pkSeen.n;
    if (first) pkSeen = { key, n: a.upJ.length, at: now }; else { pkSeen.at = now; if (grew) pkSeen.n = a.upJ.length; }
    if (grew) { // セットの時間になった：音・振動（20秒以上前なら鳴らさない）と、完了ボタンを光らせる
      if (now - a.lastEnd < 20000) alarm("プランク", `${a.upJ[a.upJ.length - 1] + 1}セット目、時間です`);
      if (tab === "menu") renderMenu();
    }
    if (a.fin) { pkEnd(); return false; } // 全部計り終わった：右上は「0から数える」に戻る
    if (!pkLive) pkRun(); // −セットで終わった形にしたあと ＋セットで時間の中に戻った：動かし直す
    const g = a.segs[a.s], left = Math.max(1, Math.ceil(g.len - (a.e - a.starts[a.s])));
    const bk = `${a.s}:${left}`;
    if (g.ph === "prep" && bk !== pkBeepKey && !p.pausedAt) beep(1); // 3・2・1 の短い音
    pkBeepKey = bk;
    const tm = $("#ftTime"), pill = $("#ftPill"), go = $("#ftGo");
    $("#ftLab").textContent = g.ph === "prep" ? "準備" : g.ph === "set" ? `${a.js[g.k] + 1}/${it.sets.length}` : "休憩";
    tm.textContent = g.ph === "prep" ? String(left) : fmtSec(left);
    pill.classList.add("pk");
    pill.classList.toggle("run", !p.pausedAt);
    go.innerHTML = p.pausedAt ? ICON_PLAY : ICON_PAUSE;
    go.setAttribute("aria-label", p.pausedAt ? "プランクを再開" : "プランクを一時停止");
    $("#ftHint").hidden = !(pkNeedTap && !p.pausedAt);
    return true;
  }
  // 種目の並び：上のアイコンで選んだ種目（いまやる）→ まだの筋トレ → まだの有酸素 → 終わったもの
  const itemOrder = () => cur.items.map((_, i) => i).sort((a, b) => itemDone(cur.items[a]) - itemDone(cur.items[b])
    || (b === cur.focus) - (a === cur.focus) || (cur.items[a].part === "cardio") - (cur.items[b].part === "cardio") || a - b);
  // ── 上のバーの「いまの状態」（始める前／休憩中／トレーニング中／全部完了／有酸素） ──
  // 時間は Date.now() から計算。cur に残す：restAt（最後にセットを完了した時刻）・restSec（その休憩の目安の秒）・doingAt（トレーニング中になった時刻）・nowEx（いまの種目）
  // いまの種目：そのセットが残っていればその種目、なければ並びの次
  function nowIdx() {
    const k = cur.items.findIndex((x) => x.exId === cur.nowEx && !itemDone(x));
    return k >= 0 ? k : itemOrder().find((x) => !itemDone(cur.items[x]));
  }
  // セットを完了した：休憩の目安は REST_SEC＋restExtra
  function markRest(i) {
    const it = cur.items[i];
    cur.restAt = Date.now();
    cur.restSec = (REST_SEC[EX[it.exId].kind] || 90) + (it.restExtra || 0);
    cur.nowEx = it.exId;
    delete cur.doingAt;
  }
  // 完了を取り消した：古い休憩の時刻が残らないようにする
  function clearRest() { delete cur.restAt; delete cur.restSec; delete cur.doingAt; }
  // 休憩を始めた時刻と目安の秒（時計が戻ったときは今にそろえる。壊れた値は使わない）
  const restAtNow = () => (Number.isFinite(cur.restAt) ? Math.min(cur.restAt, Date.now()) : 0);
  const restSecOk = () => (Number.isFinite(cur.restSec) && cur.restSec > 0 && cur.restSec <= 3600 ? cur.restSec : 90);
  function tickStat() {
    const el = $("#stat");
    if (!cur || !cur.items.length) { el.hidden = true; return; } // 種目のない日（完全休息など）は出さない
    const pa = pkStage(); // プランクを計っている間は、右上と同じ段階を出す
    const pk = pa && !pa.fin ? pa : null;
    const k = pk ? cur.items.indexOf(pk.it) : nowIdx();
    const it = k == null ? null : cur.items[k];
    const ex = it ? EX[it.exId] : null;
    let cls = "done", l = "", t = "", n = "全部完了"; // l：小さいラベル、t：太い時間、n：種目名など
    if (it) n = ex.name.replace(/（.*）/, "");
    const started = it && it.exId === cur.nowEx && Number.isFinite(cur.doingAt) && cur.doingAt >= restAtNow(); // ▶ で始めた
    // プランクを ▶ で計り終わった（完了を押すまで）：最後のセットが終わった時から休憩
    const pkFin = !pk && pa && pa.fin && pa.it === it && Number.isFinite(cur.doingAt) && pa.p.t0 >= cur.doingAt;
    if (it && it.part === "cardio" && started) { cls = "doing"; l = n; t = fmtSec(Math.floor((Date.now() - Math.min(cur.doingAt, Date.now())) / 1000)); n = ""; }
    else if (it && it.part === "cardio") { cls = "wait cardio"; l = n; t = ""; n = aimText(it.rx).replace(/<\/?b>| /g, "") || "有酸素"; }
    else if (it && pk) {
      const g = pk.segs[pk.s];
      if (g.ph === "rest") { cls = "rest"; l = `休憩・目安${fmtSec(pk.p.rs)}`; t = fmtSec(Math.floor(pk.e - pk.starts[pk.s])); }
      else { cls = "doing"; l = "セット中"; t = fmtSec(Math.floor(pk.e - pk.starts[g.ph === "prep" ? pk.s : pk.s - 1])); }
      n = "";
    } else if (it && pkFin) {
      cls = "rest"; l = `休憩・目安${fmtSec(pa.p.rs)}`; t = fmtSec(Math.floor(Math.max(0, Date.now() - pa.lastEnd) / 1000)); n = "";
    } else if (it) {
      const at = restAtNow(), rs = restSecOk();
      const sec = at && anyDone() ? (Date.now() - at) / 1000 : started ? 0 : -1;
      // トレーニング中：休憩中に ▶ を押した時刻か、目安を過ぎた時刻から（ここでは保存しない。別のタブの記録を上書きしないため）
      const doingFrom = Number.isFinite(cur.doingAt) && cur.doingAt >= at ? Math.min(cur.doingAt, Date.now()) : sec >= rs ? at + rs * 1000 : 0;
      if (sec < 0) { cls = "wait"; l = "次"; }
      else if (doingFrom) { cls = "doing"; l = "セット中"; t = fmtSec(Math.floor((Date.now() - doingFrom) / 1000)); n = ""; }
      else { cls = "rest"; l = `休憩・目安${fmtSec(rs)}`; t = fmtSec(Math.floor(sec)); n = ""; }
    }
    el.hidden = false;
    el.className = `stat ${cls}`;
    const ic = ex ? ex.icon || "" : "CHECK";
    if (el.dataset.ic !== ic) { el.dataset.ic = ic; $("#statIc").innerHTML = ic === "CHECK" ? CHECK_SVG : ic ? pictoSVG(ic) : ""; }
    $("#statL").textContent = l;
    if (el.dataset.t !== t) { el.dataset.t = t; $("#statT").innerHTML = t; }
    $("#statN").textContent = n;
  }

  // ── 毎日の早歩き（スタートで10分タイマー。夕方までにしていなければ促す） ──
  // その日の有酸素の分数（記録した分と、今日のメニューで完了にした分）
  function cardioMinOn(iso) {
    let m = 0;
    logs.forEach((s) => { if (s.date === iso) s.items.forEach((it) => { if (it.unit === "min") m += it.sets.reduce((a, x) => a + (x.m || 0), 0); }); });
    if (cur && cur.date === iso) cur.items.forEach((it) => { if (it.part === "cardio") it.sets.forEach((x) => { if (x.done) m += x.m || 0; }); });
    return m;
  }
  // 早歩き：自分で記録した日か、有酸素を早歩きの分（10分）以上やった日は達成
  const walkByCardio = (iso) => !walks[iso] && cardioMinOn(iso) >= WALK.min;
  const walkDoneOn = (iso) => !!walks[iso] || cardioMinOn(iso) >= WALK.min;
  const walkedToday = () => walkDoneOn(todayIso());
  const walk = { end: 0, id: 0 };
  function startWalk() {
    walk.end = Date.now() + WALK.min * 60000;
    clearInterval(walk.id);
    walk.id = setInterval(tickWalk, 500);
    tickWalk();
  }
  function stopWalk() { clearInterval(walk.id); walk.end = 0; }
  function tickWalk() {
    const left = Math.round((walk.end - Date.now()) / 1000);
    const el = $("#walkTime");
    if (el) el.textContent = fmtSec(Math.max(0, left));
    if (left <= 0) {
      stopWalk();
      walks[todayIso()] = WALK.min;
      saveWalks();
      alarm("早歩き 完了", `${WALK.min}分歩きました`);
      if (tab === "menu") renderMenu();
    }
  }
  function checkSteps() {
    if (new Date().getHours() < 17 || walkedToday()) return;
    if (load(LS.nudge, "") === todayIso()) return;
    save(LS.nudge, todayIso());
    notify("今日の早歩きがまだです", `${WALK.min}分、${WALK.speed}で歩きましょう`);
  }

  let toastTimer = 0;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  // ── 描画：今日のメニュー ──
  const chip = (act, val, label, on) => `<button type="button" class="chip" data-act="${act}" data-v="${esc(val)}" aria-pressed="${on}">${label}</button>`;
  const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  // 今日の内容のアイコン（自動・筋トレ・有酸素・休む）
  const DT_ICON = {
    auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9A8 8 0 0 0 5 7.5M4.5 15A8 8 0 0 0 19 16.5"/><path d="M19.8 4.5V9h-4.5M4.2 19.5V15h4.5"/></svg>',
    strength: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M20 12h2M6.5 7v10M17.5 7v10M4 9v6M20 9v6M6.5 12h11"/></svg>',
    cardio: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/><path d="M3 12.5h4.5l1.8-2.8 2.7 5.3 1.8-2.5H21"/></svg>',
    rest: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1z"/></svg>',
  };
  const GEAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>';

  function weightOptions(sel, step) {
    let h = `<option value=""${sel == null ? " selected" : ""}>—</option>`;
    const max = Math.max(step >= 2.5 ? 200 : 50, (sel || 0) + 20);
    for (let w = step; w <= max + 1e-9; w += step) {
      const v = Math.round(w * 10) / 10;
      h += `<option value="${v}"${sel != null && Math.abs(sel - v) < 1e-6 ? " selected" : ""}>${fmtKg(v)}</option>`;
    }
    if (sel != null && Math.abs(Math.round(sel / step) * step - sel) > 1e-6) h += `<option value="${sel}" selected>${fmtKg(sel)}</option>`;
    return h;
  }
  function numOptions(from, to, stepN, sel) {
    let h = "";
    for (let v = from; v <= to; v += stepN) h += `<option value="${v}"${v === sel ? " selected" : ""}>${v}</option>`;
    if (sel != null && (sel < from || sel > to)) h += `<option value="${sel}" selected>${sel}</option>`;
    return h;
  }
  function itemWeight(it) {
    const next = it.sets.find((x) => !x.done) || it.sets[it.sets.length - 1];
    return next ? next.w : null;
  }
  const unitOf = (it) => (it.rx.unit === "sec" ? "秒" : it.rx.unit === "min" ? "分" : "回");
  // 右上のスタートボタン（押すとその種目を一番上に出す）。いまやっている種目は黒い ▶
  function startHTML(it, i) {
    if (itemDone(it)) return "";
    return cur.focus === i ? `<button type="button" class="start-btn on" data-act="start" data-i="${i}" aria-label="${esc(EX[it.exId].name)}の次のセットをスタート">${ICON_PLAY}</button>`
      : `<button type="button" class="start-btn" data-act="start" data-i="${i}" aria-label="${esc(EX[it.exId].name)}をスタート">${ICON_PLAY}</button>`;
  }
  function loadHTML(it, ex) {
    if (!weighted(ex)) return `<span class="ex-load bw">自重</span>`;
    const w = itemWeight(it);
    if (w == null) return `<span class="ex-load unset"><b>—</b><small>kg</small></span>`;
    return `<span class="ex-load">${it.sug && it.sug.up ? '<i class="up" title="前回より重く">▲</i>' : ""}<b>${fmtKg(w)}</b><small>kg</small></span>`;
  }
  function selHTML(it, i, j) {
    const st = it.sets[j];
