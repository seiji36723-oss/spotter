<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="チョコザップのマシンで組む、お腹まわりを引き締めるトレーニングの記録アプリ（非公式）">

</head><body>
<title>SPOTTER 改訂版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 1カラム（最大560px）。下に固定タブ。
   色は白と黒（＋灰色）だけ。状態の違いは「塗り／枠線／薄さ」で見分ける。
   マシンや種目は人のピクトグラムで見せ、数字（kg・回・分）は細長い書体で大きく見せる。 */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --surface-2: #ededed;
  --ink: #0b0b0b;
  --muted: #6a6a6a;
  --faint: #a8a8a8;
  --line: #dedede;
  --accent: var(--ink);
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 18px rgba(0, 0, 0, .05);

  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;

  --tabs-h: 64px;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b;
    --surface: #161616;
    --surface-2: #222222;
    --ink: #f4f4f4;
    --muted: #9c9c9c;
    --faint: #5c5c5c;
    --line: #2c2c2c;
    --on-accent: #0b0b0b;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b;
  --surface: #161616;
  --surface-2: #222222;
  --ink: #f4f4f4;
  --muted: #9c9c9c;
  --faint: #5c5c5c;
  --line: #2c2c2c;
  --on-accent: #0b0b0b;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; }
/* hidden だと上に残るアイコン列（sticky）が効かないので、使える端末では clip にする */
@supports (overflow-x: clip) { html, body { overflow-x: clip; } }
button, select, input, summary, label { touch-action: manipulation; }
select { font-size: max(16px, 1em); } /* iPhone で選ぶときに画面が拡大しないように */
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 72px);
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── ヘッダー ── */
.top { padding-top: env(safe-area-inset-top, 0px); position: sticky; top: 0; z-index: 6; background: var(--bg); }
.top-in { padding-block: 10px 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; }
.ft-box { position: relative; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; }
.ft-pill { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 11px 0 9px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.ft-pill svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ft-pill b { font-family: var(--font-num); font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.ft-pill.run { background: var(--ink); color: var(--bg); }
.ft-lab { display: none; font-size: 10px; font-weight: 700; line-height: 1; white-space: nowrap; } /* プランクの計測中：段階（準備・1/2・休憩） */
.ft-hint { position: absolute; right: 0; top: 100%; z-index: 1; margin-top: 2px; padding: 2px 7px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 700; line-height: 1.3; white-space: nowrap; pointer-events: none; }
.ft-pill.pk svg { display: none; }
.ft-pill.pk .ft-lab { display: inline; }
.ft-ctl { display: grid; place-items: center; width: 32px; height: 32px; border: 1.5px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); }
.ft-ctl svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ft-ctl svg .fill { fill: currentColor; stroke: none; }
.top-in { flex-wrap: nowrap; }
@media (max-width: 370px) {
  .top-in .brand-mark { width: 26px; height: 26px; }
  .ft-box { gap: 3px; }
  .ft-pill { height: 30px; padding: 0 8px 0 7px; gap: 4px; }
  .ft-pill b { font-size: 16px; }
  .ft-ctl { width: 28px; height: 28px; }
}
.ic-btn { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); }
.ic-btn.big { width: 80px; height: 80px; background: var(--ink); color: var(--bg); }
.ic-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ic-btn.big svg { width: 34px; height: 34px; }
.ic-btn svg .fill { fill: currentColor; stroke: none; }
.eyebrow { font-family: var(--font-num); font-weight: 700; font-size: 13px; letter-spacing: .28em; color: var(--muted); }
/* ── 起動時のロゴ ── */
.splash {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  background: var(--surface); transition: opacity .45s ease, transform .45s ease;
}
.splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
.sp-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.sp-mark { width: 96px; height: 96px; overflow: visible; }
.sp-name { display: flex; gap: .14em; font-family: var(--font-num); font-weight: 700; font-style: italic; font-size: 40px; line-height: 1; letter-spacing: .02em; color: var(--ink); }
/* 斜めの文字の右上が動いている間に切れないよう、文字の枠に余白をとる（並びの間隔は変えない） */
.sp-name span { display: inline-block; padding: .08em .2em; margin: -.08em -.2em; }
.sp-in { padding: 0 12px; overflow: visible; }
.sp-sub { margin: 0; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .sp-mark { animation: sp-pop .7s cubic-bezier(.2, .9, .3, 1.35) both; }
  .sp-bell { transform-origin: 16px 18px; animation: sp-lift .5s .35s ease-out both; }
  .sp-dot { transform-box: fill-box; transform-origin: center; animation: sp-dot .45s 1s cubic-bezier(.2, .9, .3, 1.6) both; }
  .sp-name span { animation: sp-letter .4s calc(.45s + var(--i) * .06s) cubic-bezier(.2, .9, .3, 1.4) both; }
  .sp-sub { animation: sp-fade .5s 1.05s ease both; }
}
@keyframes sp-pop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.12) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes sp-lift { 0% { transform: translateY(0); } 45% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
@keyframes sp-dot { 0% { transform: scale(0); } 70% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes sp-letter { 0% { transform: translateY(14px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }

/* ── 日の種類・歩数・体重・アドバイス ── */
.rest-tag { margin-left: 8px; font-weight: 700; color: var(--faint); }
.dh-title b.key.t-cardio { background: var(--h3); }
.dh-title b.key.t-rest { background: var(--ok); }
.dh-title b.key.t-off { background: var(--muted); }
.dh-check .mini { margin-left: auto; }
/* 1週間の予定 */
.wplan { background: var(--surface); border-radius: var(--radius); padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.wp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; }
.wp-days { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wp { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 5px; border-radius: 10px; border: 1.5px solid transparent; min-width: 0; }
.wp.wp-today { border-color: var(--ink); }
.wp.past { opacity: .5; }
.wp-dow { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1; }
.wp-date { font-family: var(--font-num); font-size: 15px; font-weight: 700; line-height: 1; }
.wp-k { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 15px; font-weight: 900; }
.wp.t-strength .wp-k { background: var(--ink); color: var(--bg); }
.wp.t-cardio .wp-k { background: var(--h3); color: #fff; }
.wp.t-cardio.opt .wp-k { background: transparent; color: var(--h3); box-shadow: inset 0 0 0 2px var(--h3); }
.wp.t-rest .wp-k { background: var(--ok); color: #fff; }
.wp.t-off .wp-k { background: var(--muted); color: var(--bg); }
.wp-k i { position: absolute; right: -5px; top: -5px; width: 15px; height: 15px; border-radius: 50%; background: var(--ok); color: #fff; font-style: normal; font-size: 10px; line-height: 15px; text-align: center; box-shadow: 0 0 0 2px var(--surface); }
.wp small { font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; line-height: 1.1; }
.cpick { display: flex; flex-wrap: wrap; gap: 6px; }
.how { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.spd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
.spd b { font-family: var(--font-num); font-size: 30px; line-height: 1.1; color: var(--ink); margin: 0 1px 0 3px; }
.spd.iv b { font-family: inherit; font-size: 16px; }
.aim { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.aim b { font-family: var(--font-num); font-size: 18px; color: var(--ink); }
.now.cardio { border-color: var(--h3); }
.nudge { margin: 0; padding: 9px 12px; border-radius: 10px; background: var(--h1); color: #7a0f09; font-size: 13px; font-weight: 700; text-align: left; border: 0; width: 100%; }
.adv { margin: 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; border-left: 4px solid var(--h3); background: var(--surface); }
.adv.good { border-left-color: var(--ok); }
.advs { display: flex; flex-direction: column; gap: 6px; }
.done-today, .rest-day { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.done-today b, .rest-day b { font-size: 17px; }
.done-today > span, .rest-day > span { font-size: 13px; color: var(--muted); font-weight: 700; }
.rest-day { border-left: 5px solid var(--ok); }
.rest-day.skip { border-left-color: var(--muted); }
.skip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.skip { display: inline-flex; align-items: center; gap: 5px; padding: 7px 11px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700; }
.skip svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.skip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sp-row { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.sp-row .field .u { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.sp-row select { min-width: 4.6em; }
.sp-log { margin-left: 8px; font-size: 12.5px; color: var(--muted); }
.now { position: relative; }
.now:has(> .start-btn) .now-head { padding-top: 46px; }
.start-btn { position: absolute; top: 8px; right: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); white-space: nowrap; }
.start-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.start-btn svg .fill { fill: currentColor; stroke: none; }
.start-btn.on { background: var(--ink); color: var(--bg); }
.now.focus { box-shadow: 0 0 0 2.5px var(--ink), var(--shadow); }
.skip-x { margin-left: auto; flex: 0 0 auto; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.skip-x[aria-expanded="true"] { border-color: var(--ink); color: var(--ink); }
.skip-x svg, .skip-opt svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.skip-sheet { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.skip-opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-align: left; }
.skip-opt span { display: flex; flex-direction: column; min-width: 0; }
.skip-opt b { font-size: 15px; }
.skip-opt small { font-size: 12px; font-weight: 700; color: var(--muted); }
.skip-sheet .link { align-self: center; }
.steps { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.st-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.st-head span { font-size: 11.5px; color: var(--muted); }
.st-row { display: flex; align-items: baseline; gap: 6px; font-weight: 700; }
.st-ok { font-size: 13px; font-weight: 700; color: var(--ok); }
.steps.done { border-left: 5px solid var(--ok); }
.wk-main { display: flex; align-items: center; gap: 14px; }
.wk-big { font-size: 15px; font-weight: 700; color: var(--muted); }
.wk-big b { font-family: var(--font-num); font-size: 44px; line-height: 1; color: var(--ink); }
.wk-spd { display: flex; flex-direction: column; min-width: 0; font-size: 15px; }
.wk-spd small { font-size: 12px; color: var(--muted); font-weight: 700; }
.st-in { width: 7em; border: 0; border-bottom: 2px solid var(--ink); background: transparent; font-family: var(--font-num); font-weight: 700; font-size: 28px; padding: 0 2px; }
.st-left { margin-left: auto; font-size: 13px; color: var(--h3); }
.st-left.ok { color: var(--ok); }
.st-bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.st-bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
.st-bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.bodyrec { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
.bd-in { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bd-in label { display: flex; align-items: baseline; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.bd-in input { width: 5.4em; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 6px 8px; font-family: var(--font-num); font-weight: 700; font-size: 18px; color: var(--ink); }
.bd-in .btn { margin-left: auto; }
.bd-list { list-style: none; margin: 0; padding: 0; }
.bd-list li { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.bd-list li:first-child { border-top: 0; }
.bd-list b { font-family: var(--font-num); font-size: 18px; color: var(--ink); margin-right: 1px; }
.bd-list em { font-style: normal; font-family: var(--font-num); font-weight: 700; margin-left: 4px; }
.bd-list em.down { color: var(--ok); }
.bd-list em.up { color: var(--h3); }
.wsum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.wsum span { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: 12px; color: var(--muted); }
.wsum b { font-family: var(--font-num); font-size: 24px; color: var(--ink); line-height: 1.1; }
.wsum small { font-size: 11px; }

/* ── いちばん上の種目アイコン（スクロールしても上に残る） ── */
.menu-sticky { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); width: min(100%, 560px); bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding: 6px max(16px, env(safe-area-inset-left, 0px)) 6px; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.menu-sticky:empty { display: none; }
.ic-btn.sm { width: 30px; height: 30px; flex: 0 0 auto; }
.ic-btn.sm svg { width: 15px; height: 15px; }
.ic-btn.dark { background: var(--ink); color: var(--bg); }
.jump {
  position: static; z-index: 5; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px;
  margin: 0; padding: 0; background: var(--bg);
}
.jp {
  display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; padding: 3px 2px 2px;
  border: 1.5px solid var(--ink); background: var(--surface); border-radius: 12px; line-height: 1.15;
}
.jp-ic { position: relative; width: 26px; height: 26px; }
.jp-ic svg { width: 100%; height: 100%; display: block; }
.jp-ok { position: absolute; right: -7px; top: -5px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; background: var(--ok); color: #fff; }
.jp-l { font-size: 10px; font-weight: 700; }
.jp-n { font-family: var(--font-num); font-size: 10.5px; color: var(--muted); }
.jp-n b { font-size: 12px; color: var(--ink); }
.jp.doing { border-color: var(--h3); }
.jp.done { border-color: var(--line); }
.jp.done .jp-ic svg, .jp.done .jp-l { opacity: .45; }
.now { scroll-margin-top: calc(var(--head-h, 52px) + 10px); }

.brand { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand-mark { width: 30px; height: 30px; flex: 0 0 auto; }
.bm-bg { fill: var(--ink); }
.bm-fg { fill: var(--bg); }
.bm-dot { fill: var(--red); }
.stat { flex: 0 1 auto; min-width: 0; box-sizing: border-box; min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; background: var(--st-wait); color: var(--st-wait-ink); } /* 右のタイマーと同じ高さ。状態が変わっても上のバーの高さを変えない（文字を大きくする設定のときだけ縦に伸びる） */
.stat > * { flex: 0 0 auto; }
.stat-ic { width: 22px; height: 22px; }
.stat-ic:empty { display: none; }
.stat-ic svg { display: block; width: 100%; height: 100%; }
.stat.done .stat-ic svg { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.stat-l { font-size: 11px; }
.stat-t { font-size: 16px; font-variant-numeric: tabular-nums; }
.stat-t:empty, .stat-l:empty, .stat-n:empty { display: none; }
.stat-t small { font-size: 11px; opacity: .75; }
.stat-n { flex: 0 1 auto; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.stat.cardio { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; row-gap: 1px; align-items: center; padding-top: 0; padding-bottom: 0; line-height: 1.1; } /* 有酸素：名前の下に目安 */
.stat.cardio .stat-ic { grid-row: 1 / 3; }
.stat.cardio .stat-l, .stat.cardio .stat-n { grid-column: 2; min-width: 0; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.stat.rest, .stat.doing { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; row-gap: 1px; align-items: center; padding-top: 0; padding-bottom: 0; line-height: 1; } /* 休憩中・トレーニング中：上に小さく言葉、下に大きく時間 */
.stat.rest .stat-ic, .stat.doing .stat-ic { grid-row: 1 / 3; }
.stat.rest .stat-l, .stat.doing .stat-l { grid-column: 2; min-width: 0; font-size: 10px; line-height: 1; overflow: hidden; text-overflow: ellipsis; }
.stat.rest .stat-t, .stat.doing .stat-t { grid-column: 2; font-size: 19px; line-height: 1; }
.stat.rest { background: var(--st-rest); color: var(--st-rest-ink); }
.stat.doing { background: var(--st-doing); color: var(--st-doing-ink); }
.stat.done { background: var(--st-done); color: var(--st-done-ink); }
@media (max-width: 370px) {
  .stat { gap: 4px; padding: 3px 8px 3px 5px; min-height: 30px; }
  .stat-ic { width: 20px; height: 20px; }
  .stat-l { font-size: 10px; }
  .stat-t { font-size: 14px; }
  .stat-t small { font-size: 10px; }
  .stat-n { font-size: 11px; }
  .stat.rest .stat-t, .stat.doing .stat-t { font-size: 16px; }
}
.sub { margin: 0; font-size: 11px; color: var(--muted); }

.view { display: flex; flex-direction: column; gap: 14px; padding-block: 4px 8px; }

/* ── 絵（ピクトグラム）のタイル。絵は文字色で描くので、暗い表示では白い絵になる ── */
.thumb {
  position: relative; flex: 0 0 auto; display: grid; place-items: center;
  background: var(--surface); color: var(--ink); border-radius: 12px;
}
.thumb svg { display: block; width: 84%; height: 84%; }

/* ── 条件のチップ ── */
.ctl-row { display: flex; align-items: center; gap: 10px; }
.ctl-label { flex: 0 0 2.6em; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 14px;
  line-height: 1.3;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.chip .n { font-family: var(--font-num); font-weight: 700; font-size: 16px; }

.btn {
  border: 1.5px solid var(--ink); background: var(--surface); border-radius: 12px;
  padding: 9px 14px; font-size: 14px; font-weight: 700;
}
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { border-style: dashed; background: transparent; }
.btn.block { width: 100%; padding: 16px; font-size: 16px; letter-spacing: .08em; border-radius: 14px; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.mini.warn { border-color: var(--ink); font-weight: 700; }
.link { background: none; border: 0; padding: 0; font-size: 12.5px; color: var(--muted); text-decoration: underline; }

.notice {
  background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px;
  padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 10px;
}
.notice .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.empty {
  border: 1.5px dashed var(--faint); border-radius: 12px; padding: 18px; text-align: center;
  color: var(--muted); font-size: 14px;
}

/* ── 今日やること（見出しカード） ── */
.done-banner {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  width: 100%; text-align: left; border: 0; background: var(--ink); color: var(--bg);
  border-radius: 12px; padding: 12px 14px; font-weight: 700;
}
.done-banner span { font-size: 13px; white-space: nowrap; }
.review { position: relative; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px; padding: 8px 40px 8px 12px; font-size: 13px; }
.review summary { cursor: pointer; font-weight: 700; }
.review ul { margin-top: 6px; }
.review .x { position: absolute; top: 2px; right: 2px; width: 36px; height: 36px; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); }
.rv-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rv-sub { margin: 0; font-size: 12px; color: var(--muted); }
.review ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.review li b { font-family: var(--font-num); font-size: 17px; }
.rv-up, .rv-sw, .rv-pr { display: inline-block; width: 1.4em; font-weight: 700; }

.today { display: flex; flex-direction: column; gap: 12px; }
.week-seg { display: flex; flex-direction: column; gap: 6px; }
.seg-label { font-size: 12px; color: var(--muted); font-weight: 700; }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg {
  position: relative; display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px;
}
.seg b { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1; }
.seg span { font-size: 12.5px; line-height: 1.35; color: var(--muted); min-width: 0; }
.seg[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); }
.seg[aria-pressed="true"] b, .seg[aria-pressed="true"] span { color: var(--bg); }

.today-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.today-sum { display: flex; flex-direction: column; min-width: 0; }
.today-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.today-big { font-size: 14px; font-weight: 700; }
.today-big b { font-family: var(--font-num); font-size: 44px; line-height: 1; margin-right: 2px; }
.today-min { margin-left: 8px; font-weight: 500; color: var(--muted); }
.today-groups { font-size: 13px; font-weight: 700; }
.cond-btn {
  align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: baseline; gap: 8px;
  border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 5px 10px;
  font-size: 13px; font-weight: 700; line-height: 1.3;
}
.cond-btn span { font-size: 11px; color: var(--muted); border-bottom: 1px solid currentColor; }

/* ── 体の図（前・後ろ）。黒いシルエットに、きたえた部位だけ赤 ── */
:root { --sil: #151515; --sil-line: #444; --plan: #d4d4d4; --red: #e3342b; --red-sub: #f09b94; --h1: #ffd2cc; --h2: #ff9a8f; --h3: #f2493c; --h4: #c4130b; --ok: #1f9d55; --st-wait: #eef0f2; --st-wait-ink: #6b7280; --st-rest: #e3efff; --st-rest-ink: #1f5fbf; --st-doing: #ffe5e3; --st-doing-ink: #c62828; --st-done: #e4f4e8; --st-done-ink: #1b7f3b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sil: #dcdcdc; --sil-line: #9a9a9a; --plan: #6c6c6c; --red: #ff4b40; --red-sub: #c7615a; --h1: #ffc4bd; --h2: #ff8a7e; --h3: #ff4b3e; --h4: #d4170e; --ok: #3ccf7a; --st-wait: #262a30; --st-wait-ink: #a3acb9; --st-rest: #152a47; --st-rest-ink: #84b8ff; --st-doing: #40191a; --st-doing-ink: #ff938a; --st-done: #14321f; --st-done-ink: #62d68b; } }
:root[data-theme="dark"] { --sil: #dcdcdc; --sil-line: #9a9a9a; --plan: #6c6c6c; --red: #ff4b40; --red-sub: #c7615a; --h1: #ffc4bd; --h2: #ff8a7e; --h3: #ff4b3e; --h4: #d4170e; --ok: #3ccf7a; --st-wait: #262a30; --st-wait-ink: #a3acb9; --st-rest: #152a47; --st-rest-ink: #84b8ff; --st-doing: #40191a; --st-doing-ink: #ff938a; --st-done: #14321f; --st-done-ink: #62d68b; }
.body-map { display: flex; gap: 4px; flex: 0 0 auto; }
.body-map figure {
  margin: 0; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 3px 1px;
}
.body-map svg { display: block; width: 100%; height: auto; }
.body-map figcaption { font-size: 10px; font-weight: 700; color: var(--muted); line-height: 1.5; }
.body-map.mini figure { flex: 0 0 30px; padding: 3px 2px; }
.body-map.mini figcaption { display: none; }
.body-map.mid figure { flex: 0 0 62px; }
.body-map .skin { fill: var(--sil); }
.body-map .m { fill: var(--sil); stroke: var(--sil-line); stroke-width: .7; }
.body-map .m.plan { fill: var(--plan); }
.body-map .m.sub { fill: var(--red-sub); }
.body-map .m.on { fill: var(--red); }
.body-map .m.h1 { fill: var(--h1); } .body-map .m.h2 { fill: var(--h2); } .body-map .m.h3 { fill: var(--h3); } .body-map .m.h4 { fill: var(--h4); }
.body-map.big { justify-content: center; gap: 12px; }
.body-map.big figure { flex: 0 1 120px; padding: 8px 6px 2px; }
.body-map.big figcaption { font-size: 12px; }
.body-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 5px; font-size: 11px; color: var(--muted); }
.lg { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-left: 4px; }
.lg:first-child { margin-left: 0; }
.lg.on { background: var(--red); } .lg.sub { background: var(--red-sub); } .lg.plan { background: var(--plan); border: 1px solid var(--faint); }
.lg.h1 { background: var(--h1); } .lg.h2 { background: var(--h2); } .lg.h3 { background: var(--h3); } .lg.h4 { background: var(--h4); } .lg.none { background: var(--sil); }
.heat-legend { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 3px; font-size: 11.5px; color: var(--muted); }
.heat-legend span { display: inline-flex; align-items: center; gap: 4px; }
.heat-legend .lg { width: 18px; height: 10px; margin: 0; }
.heat-legend span:last-child { margin-left: 10px; }
.hint.center { text-align: center; }
@media (prefers-reduced-motion: no-preference) { .body-map .m { transition: fill .3s; } }

/* ── 今日の内容・メモ・部位別セット数 ── */
.dh-title b.key { display: inline-grid; place-items: center; min-width: 1.6em; padding: 0 6px; margin-left: 4px; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-size: 20px; line-height: 1.4; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mode {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 2px; min-width: 0;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 12.5px; font-weight: 700; line-height: 1.25; text-align: center;
}
.mode small { font-size: 10.5px; font-weight: 700; color: var(--muted); }
.mode.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.mode.on small { color: var(--bg); opacity: .8; }
.mode-why { margin: -6px 2px 0; font-size: 12px; color: var(--muted); }
.dh-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dh-title b.key { margin-left: 0; }
.dh-parts { font-size: 17px; font-weight: 700; color: var(--ink); }
.dh-mode { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--h1); color: #7a0f09; }
.prev { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; }
.prev-l { font-weight: 700; color: var(--muted); }
.prev-v { color: var(--muted); }
.prev-v b { font-family: var(--font-num); font-size: 18px; color: var(--ink); }
.goal { margin-left: auto; font-weight: 700; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--ink); }
.goal.up { border-color: var(--h3); background: var(--h3); color: #fff; }
.gain { align-self: flex-start; font-family: var(--font-num); font-weight: 700; font-size: 15px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.gain.up { background: var(--h3); color: #fff; }
.summary { display: flex; flex-direction: column; gap: 6px; }
.sum-up { align-self: flex-start; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--h3); color: #fff; }
.summary ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; }
.summary ul b { font-family: var(--font-num); font-size: 17px; color: var(--h2); }
.grow { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.grow-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.grow-head span { font-size: 12px; color: var(--muted); }
.grow-head span b { font-family: var(--font-num); font-size: 20px; color: var(--ink); }
.grow-head em { display: block; text-align: right; font-style: normal; font-weight: 700; font-size: 11.5px; color: var(--muted); }
.grow-head em.up { color: var(--h3); }
.vbars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; height: 96px; align-items: end; }
.vb { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.vb i { display: block; width: 100%; border-radius: 4px 4px 2px 2px; background: var(--h1); }
.vb.now i { background: var(--h3); }
.vb span { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.prs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prs li { display: grid; grid-template-columns: minmax(0, 1fr) 76px auto 3.2em; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.prs li:first-child { border-top: 0; }
.pr-name { font-size: 13px; font-weight: 700; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3; }
.spark { width: 76px; height: 22px; overflow: visible; }
.spark polyline { fill: none; stroke: var(--h3); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--h3); }
.pr-val { font-size: 12px; color: var(--muted); white-space: nowrap; }
.pr-val b { font-family: var(--font-num); font-size: 17px; color: var(--ink); }
.pr-d { font-family: var(--font-num); font-weight: 700; font-size: 14px; text-align: right; color: var(--muted); }
.pr-d.up { color: var(--h3); }
.notes { margin: -4px 0 0; padding: 8px 12px 8px 26px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--h3); font-size: 12.5px; font-weight: 700; }
.notes li + li { margin-top: 2px; }
.wk { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.wk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.wk-head span { font-size: 11.5px; color: var(--muted); }
.wk-row { display: flex; align-items: center; gap: 8px; }
.wk-label { flex: 0 0 2.4em; font-size: 12px; font-weight: 700; color: var(--muted); }
.wk-row .pchips { flex: 1; min-width: 0; }
.pchips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.pchip { display: flex; flex-direction: column; align-items: center; padding: 5px 2px 4px; border-radius: 10px; line-height: 1.15; min-width: 0; }
.pchip em { font-style: normal; font-size: 12px; font-weight: 700; }
.pchip b { font-family: var(--font-num); font-size: 22px; white-space: nowrap; }
.pchip b i { font-style: normal; font-size: 13px; margin: 0 1px; opacity: .7; }
.pchip small { font-size: 10.5px; font-weight: 700; }
.pchip.low { background: var(--h3); color: #fff; }
.pchip.mid { background: var(--h1); color: #7a0f09; }
.pchip.ok { background: transparent; border: 1.5px solid var(--ok); color: var(--ok); }
.pchip.over { background: var(--surface-2); color: var(--muted); }
.cal-key { position: absolute; bottom: 2px; left: 0; right: 0; font-style: normal; font-size: 9px; line-height: 1; text-align: center; opacity: .85; }
.courses { display: flex; flex-direction: column; gap: 8px; }
.crs { border: 1.5px solid var(--line); border-radius: 12px; }
.crs.on { border-color: var(--ink); }
.crs-row { display: flex; align-items: stretch; }
.crs-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: none; border: 0; text-align: left; color: var(--ink); }
.crs-pick span { display: flex; flex-direction: column; min-width: 0; }
.crs-pick b { font-size: 16px; }
.crs-pick small { font-size: 12px; font-weight: 700; color: var(--muted); }
.crs-dot { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.crs.on .crs-dot { border: 6px solid var(--ink); }
.crs-more { flex: 0 0 48px; background: none; border: 0; border-left: 1px solid var(--line); font-size: 14px; color: var(--ink); }
.crs-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 12px; }
.crs-week .wp { padding: 4px 0; }
.crs-week .wp-k { width: 28px; height: 28px; font-size: 13px; }
.crs-note { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); }
.wp-course { margin-left: 8px; font-size: 12px; color: var(--muted); }
.menu-def { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.menu-def li { display: flex; align-items: flex-start; }
.menu-def li > span { display: flex; flex-direction: column; }
.menu-def em { font-style: normal; font-weight: 700; }
.menu-def b { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 1.8em; padding: 1px 4px; margin-right: 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 900; white-space: nowrap; }

/* ── 今日のメニュー（スマホ向けに詰めた形） ── */
.day-hero { display: flex; flex-direction: column; gap: 2px; }
.dh-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
.dh-date { font-family: var(--font-display); font-size: clamp(24px, 8.4vw, 32px); line-height: 1.15; letter-spacing: .01em; white-space: nowrap; }
.dh-sum { margin-left: auto; }
.dh-sum { font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; text-align: right; line-height: 1.3; }
.dh-sum b { font-family: var(--font-num); font-size: 24px; color: var(--ink); }
.dh-title { font-size: 15px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.dh-title b { color: var(--ink); font-size: 19px; }
.dh-check { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.dh-ok { color: var(--ok); font-weight: 700; }
.dh-ng { color: var(--h3); font-weight: 700; }
.dh-pace { margin-top: 4px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border-left: 4px solid var(--ink); font-size: 12.5px; font-weight: 700; }
.dh-pace.high { border-left-color: var(--ok); }
.dh-pace.comeback, .dh-pace.gap { border-left-color: var(--h3); }
.opts {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700;
}
.opts svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; flex: 0 0 auto; }
.opts span { flex: 1; min-width: 0; }
.opts em { font-style: normal; font-size: 12px; border-bottom: 1.5px solid var(--ink); }
.opts[aria-expanded="true"] { border-color: var(--ink); }
.today-strip {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border-radius: var(--radius); padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
}
.ts-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ts-label { font-size: 13px; font-weight: 700; }
.ts-label b { font-family: var(--font-num); font-size: 24px; line-height: 1; }
.ts-groups { font-size: 12px; font-weight: 700; color: var(--muted); }
.gear {
  flex: 0 0 40px; align-self: stretch; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface);
  display: grid; place-items: center;
}
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.gear[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.cool-line { margin: 0 2px; font-size: 12px; color: var(--muted); }
.cool-line b { color: var(--ink); margin-right: 4px; }
.ctl-col { display: flex; flex-direction: column; gap: 6px; }
.ctl-col .ctl-label b { font-family: var(--font-num); font-size: 15px; color: var(--ink); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.seek { display: flex; gap: 4px; margin: -8px 0 -10px; }
.seek button { flex: 1; min-width: 0; height: 30px; padding: 0; border: 0; background: none; display: flex; align-items: center; }
.seek button::before { content: ""; flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.seek button.done::before { background: var(--ink); }
.seek button.at::before { height: 6px; background: var(--ink); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.seek button.at:not(.done)::before { background: var(--muted); }

.now { background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); }
.now.complete { border-color: var(--line); background: transparent; box-shadow: none; }
.now.complete .now-name { color: var(--muted); }
.now.complete .thumb svg { opacity: .35; }
.now-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px 12px; }
.now-head .thumb { width: 64px; height: 64px; border: 1px solid var(--line); }
.now-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.now-step { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.now-name { font-size: 18px; font-weight: 700; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
.now-meta { font-size: 12.5px; color: var(--muted); }
.reps { font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.2; margin-top: 2px; }
.reps b { font-family: var(--font-num); font-size: 30px; color: var(--ink); margin-right: 1px; }
.reps .x { margin: 0 6px; font-size: 16px; }
.now.complete .reps b { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.all-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px;
  border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 12px; font-size: 16px; font-weight: 700;
}
.all-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.all-btn[aria-pressed="true"] { background: transparent; color: var(--ok); border-color: var(--ok); font-size: 14px; min-height: 44px; }
.now .ex-body { padding: 0 12px 12px; }

.next { display: flex; flex-direction: column; gap: 4px; }
.next-label { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 6px 6px;
}
.row .thumb { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.row-name { font-weight: 700; font-size: 14px; word-break: keep-all; overflow-wrap: anywhere; }
.row-meta { font-size: 12px; color: var(--muted); }
.row-val { font-size: 12px; color: var(--muted); white-space: nowrap; }
.row-val b { font-family: var(--font-num); font-size: 20px; color: var(--ink); margin-right: 1px; }
.row-done { font-weight: 700; }
.row-go { color: var(--faint); font-size: 20px; line-height: 1; }
.row.done { opacity: .5; }
.more-btn {
  display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%;
  border: 1.5px dashed var(--faint); background: transparent; border-radius: 12px; padding: 8px; font-size: 13px; font-weight: 700; color: var(--muted);
}

/* ── 記録のまとめ・クールタイム ── */
.psum, .cool { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.psum-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tabs2 { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
.tabs2 button { border: 0; background: transparent; padding: 5px 16px; font-weight: 700; font-size: 13px; }
.tabs2 button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.psum-range { font-family: var(--font-num); font-size: 15px; color: var(--muted); }
.psum-range b { color: var(--ink); font-size: 18px; }
.psum-stats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 12.5px; color: var(--muted); }
.psum-stats b { font-family: var(--font-num); font-size: 24px; color: var(--ink); margin-right: 2px; }
.psum-stats b.t { font-family: var(--font-body); font-size: 14px; }
.psum-body { display: flex; align-items: center; gap: 12px; }
.gbars, .cbars { flex: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.gbars li, .cbars li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
.gbars i, .cbars i { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.gbars i b { display: block; height: 100%; background: var(--red); border-radius: 4px; }
.cbars i b { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.gbars em, .cbars em { font-style: normal; font-family: var(--font-num); font-size: 15px; min-width: 1.4em; text-align: right; }
.cbars em { font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.gbars li.zero { color: var(--faint); }
.cool-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cool-head span { font-size: 11.5px; color: var(--muted); }
.cchips { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 700; }
.cchip small { font-size: 11.5px; font-weight: 700; }
.cchip.c3 { background: var(--h4); color: #fff; }
.cchip.c2 { background: var(--h3); color: #fff; }
.cchip.c1 { background: var(--h1); color: #7a0f09; }
.cchip.ok { background: transparent; border: 1.5px solid var(--ok); color: var(--ok); }
.day-top { display: flex; align-items: center; gap: 10px; }
.day-top .day-head { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; gap: 2px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); }
.bar-label { font-size: 12px; color: var(--muted); margin-top: -4px; }
.cond { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

/* ── 使える器具（今日のメニュー） ── */
.eq { display: flex; flex-direction: column; gap: 8px; }
.eq-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px;
}
.eq-btn[aria-expanded="true"] { border-color: var(--ink); }
.eq-label { font-weight: 700; font-size: 14px; }
.eq-count { font-size: 13px; color: var(--muted); }
.eq-count b { font-family: var(--font-num); font-size: 18px; color: var(--ink); margin-right: 1px; }
.eq-more { margin-left: auto; font-size: 12px; font-weight: 700; border-bottom: 1.5px solid var(--ink); }
.dt-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dt-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.1; }
.dt-tile svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dt-tile small { font-size: 10.5px; color: var(--muted); }
.dt-tile[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.dt-tile[aria-pressed="true"] small { color: var(--bg); opacity: .75; }
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.eq-tile {
  position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 2px 4px;
  border: 1.5px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink);
  font-family: var(--font-num); font-weight: 700; font-size: 13px; line-height: 1.1;
}
.eq-tile svg { width: 100%; max-width: 44px; aspect-ratio: 1; }
.gym-ic { flex: 0 0 auto; width: 46px; height: 46px; color: var(--ink); }
.gym-ic.sm { width: 22px; height: 22px; vertical-align: -6px; margin: 0 4px 0 2px; }
.gym-t b { font-size: 14px; line-height: 1.35; }
.crs-pick:has(.gym-t) { gap: 8px; padding: 10px 6px 10px 10px; }
.crs-row:has(.gym-t) .crs-more { flex-basis: 40px; }
.gym-t .gym-n { font-family: var(--font-num); font-size: 13px; }
.eq-tile span.sn { font-family: inherit; font-size: 10px; white-space: nowrap; letter-spacing: -.02em; }
.eq-tile[aria-pressed="false"] { border-color: var(--line); border-style: dashed; color: var(--faint); }
.eq-tile[aria-pressed="false"] svg { opacity: .35; }
.eq-tile[aria-pressed="false"]::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: 42%; height: 2px;
  background: var(--muted); transform: rotate(-35deg);
}

/* ── 種目カード ── */
.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ex { background: var(--surface); border: 1.5px solid transparent; border-radius: var(--radius); box-shadow: var(--shadow); }
.ex.open { border-color: var(--ink); }
.ex.complete { background: transparent; border-color: var(--line); box-shadow: none; }
.ex.complete .ex-name, .ex.complete .ex-load b { color: var(--muted); }
.ex.complete .thumb svg { opacity: .3; }
.ex-head {
  width: 100%; display: flex; align-items: center; gap: 12px;
  background: none; border: 0; padding: 10px 14px 10px 10px; text-align: left;
}
.ex-head .thumb { width: 72px; height: 72px; border: 1px solid var(--line); }
.ex-no {
  position: absolute; top: -6px; left: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
  background: #0b0b0b; color: #ffffff;
  display: grid; place-items: center;
  font-family: var(--font-num); font-weight: 700; font-size: 14px; line-height: 1;
}
.ex-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ex-name { font-weight: 700; font-size: 16px; line-height: 1.35; }
.ex-meta { font-size: 12.5px; color: var(--muted); }
.dots { display: flex; gap: 4px; margin-top: 4px; }
.dots i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--ink); }
.ex-load { flex: 0 0 auto; display: flex; align-items: baseline; gap: 2px; white-space: nowrap; }
.ex-load b { font-family: var(--font-num); font-weight: 700; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.ex-load small { font-size: 13px; font-weight: 700; color: var(--muted); }
.ex-load .up { font-style: normal; font-size: 12px; margin-right: 2px; align-self: center; }
.ex-load.bw { font-size: 13px; font-weight: 700; color: var(--muted); }
.ex-load.unset b { color: var(--faint); }

.ex-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.w-row { display: flex; align-items: center; gap: 8px; }
.w-label { font-size: 12px; font-weight: 700; color: var(--muted); flex: 0 0 auto; }
.stp {
  flex: 0 0 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--surface);
  font-size: 22px; font-weight: 700; line-height: 1;
}
.w-big { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.w-big select {
  min-width: 0; width: 100%; max-width: 9em; text-align: center; text-align-last: center;
  border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; background: transparent;
  padding: 0 4px; font-family: var(--font-num); font-weight: 700; font-size: 36px; line-height: 1.15;
}
.w-big span { font-weight: 700; color: var(--muted); }
.suggest { margin: 0; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.suggest.up { background: var(--ink); color: var(--bg); }
.suggest b { font-family: var(--font-num); font-size: 16px; color: var(--ink); }
.suggest.up b { color: var(--bg); }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-no { flex: 1; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.set-w { font-family: var(--font-num); font-size: 15px; color: var(--muted); }
.field { display: flex; align-items: baseline; gap: 4px; }
.field select {
  width: 4.6em; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
  padding: 4px 6px; font-family: var(--font-num); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums;
}
.field .u { font-size: 12px; color: var(--muted); }
.check {
  flex: 0 0 auto; min-width: 84px; height: 44px; border-radius: 12px;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 14px;
}
.check svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check.up { background: var(--h3); border-color: var(--h3); color: #fff; box-shadow: 0 0 0 3px var(--h1); } /* プランクの時間になった：押すまで光る */
@media (prefers-reduced-motion: no-preference) { .check.up { animation: chk-up 1s ease-in-out infinite; } }
@keyframes chk-up { 0%, 100% { box-shadow: 0 0 0 2px var(--h1); } 50% { box-shadow: 0 0 0 7px var(--h2); } }
.set-row.done .field select { opacity: .5; }

.ex-actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
.ex-actions .spacer { flex: 1; }
.tips summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.tips ul { margin: 4px 0 0; padding-left: 1.2em; font-size: 13.5px; }
.tips[open] { flex-basis: 100%; }

/* ── 記録 ── */
.summary { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.day { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day-head b { font-size: 18px; }
.day-head span { font-size: 13px; color: var(--muted); font-weight: 700; }
.empty-day p { margin: 0; color: var(--muted); font-size: 14px; }
.day-list { margin: 0; padding: 0; list-style: none; }
.day-list li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 8px 0; border-top: 1px solid var(--line);
}
.day-list li:first-child { border-top: 0; }
.day-list .thumb { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); }
.dl-name { font-weight: 700; font-size: 14.5px; min-width: 0; }
.dl-main { min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.dl-val { font-size: 12.5px; color: var(--muted); }
.dl-val b { font-family: var(--font-num); font-size: 18px; color: var(--ink); }
.diff { font-family: var(--font-num); font-weight: 700; font-size: 14px; text-align: right; }
.diff.up { color: var(--ink); }
.diff.down { color: var(--muted); }
.diff.same { color: var(--faint); }
.diff.new { justify-self: end; font-family: var(--font-body); font-size: 11px; border: 1px solid var(--ink); border-radius: 4px; padding: 0 5px; }
.day-foot { display: flex; justify-content: flex-end; }
.del-confirm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }

.cal { background: var(--surface); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal-dow { font-size: 11px; color: var(--muted); text-align: center; }
.cal-day {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2);
  display: grid; place-items: center; padding: 0;
  font-family: var(--font-num); font-size: 15px; color: var(--muted);
}
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--muted); }
.cal-day.sel { outline: 2.5px solid var(--ink); outline-offset: 1.5px; }
.cal-day.future { opacity: .35; }

.rec-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rec-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.rc { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1.5px solid transparent; }
.rc small { font-weight: 500; margin-left: 4px; font-size: 11px; }
.rc.ok { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rc.wait { border-color: var(--ink); border-style: dashed; color: var(--ink); }
.rc.none { border-color: var(--line); color: var(--faint); }

/* ── 設定 ── */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.card h3 { margin: 0; font-size: 15px; }
.machines { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mc {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px;
  border: 1.5px solid var(--line); border-radius: 12px; font-size: 12px; font-weight: 700; line-height: 1.3; cursor: pointer;
}
.mc .thumb { width: 100%; aspect-ratio: 1; border-radius: 8px; background: transparent; }
.mc input { position: absolute; opacity: 0; pointer-events: none; }
.mc .mc-name { min-height: 2.6em; padding-inline: 2px; font-size: 11.5px; }
.mc .mc-tick {
  position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid #0b0b0b; background: #ffffff; display: grid; place-items: center; color: #ffffff;
}
.mc .mc-tick svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.mc:has(input:checked) { border-color: var(--ink); }
.mc:has(input:checked) .mc-tick { background: #0b0b0b; }
.mc:not(:has(input:checked)) .thumb svg { opacity: .2; }
.mc:not(:has(input:checked)) .mc-name { color: var(--faint); text-decoration: line-through; }
.mc:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.set-line select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; }
.xfer { width: 100%; min-height: 110px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-family: ui-monospace, monospace; font-size: 16px; resize: vertical; }

/* ── タブ ── */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabs-h); }
.tab {
  position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 700; color: var(--faint);
}

  const PFX = /\/kaitei\//.test(location.pathname) ? "kaitei_" : "";
  if (PFX) {
    try {
      if (!localStorage.getItem(PFX + "copied")) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("cz_")) keys.push(k); }
        keys.forEach((k) => localStorage.setItem(PFX + k, localStorage.getItem(k)));
        localStorage.setItem(PFX + "copied", "1");
      }
    } catch (e) { /* 写せなくても続ける */ }
  }
  const load = (k, fb) => {
    try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; }
