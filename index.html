    const h = perfHistory(ex.id, 1)[0];
    const mk = (w, reps, text, up = false) => ({ w, reps: Array.from({ length: nSets }, (_, j) => reps[Math.min(j, reps.length - 1)]), text, up });
    if (!h) {
      const r0 = ex.unit === "sec" ? 20 : ex.part === "abs" ? 12 : ex.acc ? 12 : 10;
      return weighted(ex)
        ? mk(ex.start, [r0], `初めて：<b>${fmtKg(ex.start)}kg</b> × ${r0}${u} から`)
        : mk(null, [ex.unit === "sec" ? 20 : 10], "初めて：できる範囲で。フォームを優先");
    }
    const last = h.it.sets;
    const lastR = last.map((x) => x.r || 0);
    const lastW = weighted(ex) ? Math.max(...last.map((x) => x.w || 0)) || null : null;
    const ld = lastDay();
    const gap = ld ? daysBetween(ld, todayIso()) : 0;
    const repStr = lastR.join("・") + u;
    const wStr = lastW != null ? `${fmtKg(lastW)}kg × ` : "";
    if (gap >= 14) {
      const w = lastW != null ? Math.max(step, Math.min(snap(lastW * 0.85), lastW - step)) : null;
      return mk(w, [ex.unit === "sec" ? Math.max(20, Math.min(...lastR)) : lo + 2], `${gap}日ぶり：前回 ${wStr}${repStr} → ${w != null ? `<b>${fmtKg(w)}kg</b> に軽くして` : "少なめで"}体を慣らす`);
    }
    if (lastW != null && last.length >= Math.min(nSets, 3) && lastR.every((r) => r >= hi)) {
      const w = lastW + step;
      return mk(w, [lo], `前回 ${wStr}${repStr} 全部${hi}${u} → <b>${fmtKg(w)}kg</b> に上げて${lo}${u}以上`, true);
    }
    // 同じ重さで、いちばん少なかったセットを少し増やす
    const reps = Array.from({ length: nSets }, (_, j) => Math.min(hi, lastR[Math.min(j, lastR.length - 1)]));
    const k = reps.indexOf(Math.min(...reps));
    if (reps[k] < hi || !weighted(ex)) reps[k] += inc;
    const total = reps.reduce((a, r) => a + r, 0);
    return mk(lastW, reps, `前回 ${wStr}${repStr} → 今日は<b>合計${total}${u}</b>以上`);
  }

  // ── 今日のメニューを作る ──
  // 1つの枠（部位）の種目を選ぶ：使える器具で、昨日やっていない（連続日のとき）、今日のほかの枠と重ならないもの
  function pickFor(slot, avoid, taken) {
    const cands = slot.ex.map((id) => EX[id]).filter((e) => usable(e) && !taken.has(e.id));
    return cands.find((e) => !avoid.has(e.id)) || cands[0] || null;
  }
  function makeItem(ex, part, role, nSets, optional) {
    const t = target(ex, nSets);
    return {
      exId: ex.id, part, role, optional: !!optional,
      rx: { unit: ex.unit, lo: ex.range[0], hi: ex.range[1] },
      sug: { text: t.text, up: t.up },
      sets: t.reps.map((r) => ({ w: t.w, r, t: r, done: false })), // t：そのセットの目標回数
    };
  }
  // 有酸素：速さはこちらで指示、時間は目安（lo〜hi分）を出して本人が入れる
  function cardioItem(range, role, exId) {
    const ex = exId ? EX[exId] : CARDIO_EX.map((id) => EX[id]).find(usable) || EX.home_walk;
    return { exId: ex.id, part: "cardio", role, rx: { unit: "min", lo: range[0], hi: range[1] }, sets: [{ m: range[0], done: false }] };
  }
  // 筋トレの時間の見積もり（分）：準備5分＋（1セット＋休憩）×セット数
  const strengthMinutes = (items) => 5 + items.filter((it) => it.part !== "cardio").reduce((a, it) => a + it.sets.length * (MIN_PER[EX[it.exId].kind] || 3), 0);
  function makeCur(override) {
    const today = todayIso();
    const auto = planFor(today);
    const type = override || auto.type;
    const notes = [];
    let items = [];
    let key = null;
    let mode = null;
    let why = override ? `手で「${DAY_TYPES[type]}」に変更中` : auto.why;
    if (type === "strength") {
      const sm = strengthMode(today);
      mode = sm.mode;
      if (override) why = sm.why;
      key = nextKey();
      const menu = MENUS[key];
      const taken = new Set();
      menu.slots.forEach((slot) => {
        const ex = pickFor(slot, new Set(), taken);
        if (!ex) { notes.push(`${PART_NAMES[slot.part]}：使える器具の種目がないので省略`); return; }
        taken.add(ex.id);
        items.push(makeItem(ex, slot.part, slot.part === "abs" ? "abs" : "main", slot.sets));
      });
      // 筋トレ後の有酸素。時間が足りない日は休憩ではなく、有酸素→腹筋の順に削る
      const limit = settings.minutes + 5;
      const room = Math.floor((limit - strengthMinutes(items)) / 5) * 5;
      if (room < menu.cardio[0]) {
        notes.push(`${settings.minutes}分に収めるため、筋トレ後の有酸素は省略`);
        const abs = items.find((it) => it.role === "abs");
        const absBase = abs ? abs.sets.length : 0;
        while (abs && abs.sets.length > 1 && strengthMinutes(items) > limit) abs.sets.pop();
        if (abs && strengthMinutes(items) > limit) { items = items.filter((it) => it !== abs); notes.push("腹筋も省略"); }
        else if (abs && abs.sets.length < absBase) notes.push(`腹筋は${abs.sets.length}セットに`);
      } else items.push(cardioItem([menu.cardio[0], Math.min(menu.cardio[1], room)], "cardio"));
    } else if (type === "cardio") {
      items.push(cardioItem(CARDIO_DAY, "cardio-day"));
    } else if (type === "off") {
      items.push(cardioItem([20, 30], "home", "home_walk"));
    }
    const optional = !override && type === "cardio" && !!auto.optional; // 疲れていなければやる日
    return { ver: 6, date: today, createdAt: Date.now(), startedAt: null, type, override: override || null, optional, why, day: key, mode, items, notes, intervalOK: type === "cardio" && intervalOK(today), interval: false };
  }

  const anyDone = () => !!cur && cur.items.some((it) => it.sets.some((x) => x.done));
  const itemDone = (it) => it.sets.length > 0 && it.sets.every((x) => x.done);
  const curSets = () => cur.items.reduce((a, it) => a + (it.part === "cardio" ? 0 : it.sets.length), 0);
  const cardioMin = () => cur.items.filter((it) => it.part === "cardio").reduce((a, it) => a + it.sets[0].m, 0);
  const menuMinutes = () => Math.round((cur.type === "strength" ? strengthMinutes(cur.items) : 0) + cardioMin());

  // ── 記録して終える ──
  function sessionOf(c, endedAt) {
    const items = c.items.map((it) => ({
      exId: it.exId,
      unit: it.rx.unit,
      sets: it.sets.filter((x) => x.done).map((x) => (it.rx.unit === "min" ? { m: x.m } : { w: x.w, r: x.r })),
    })).filter((it) => it.sets.length);
    const startedAt = c.startedAt || c.createdAt;
    const type = c.type === "off" ? "home" : c.type === "strength" ? "strength" : "cardio";
    return { v: 5, id: "s" + endedAt.toString(36), date: formatDateISO(new Date(startedAt)), type, day: c.day, interval: !!c.interval, startedAt, endedAt, items };
  }
  // 今日のメニューを用意する。前の日に途中まで記録して終えていなければ、その日の分として保存
  function ensureToday() {
    const today = todayIso();
    if (cur && cur.date !== today) {
      if (anyDone()) {
        const started = cur.startedAt || cur.createdAt;
        logs.push(sessionOf(cur, started + Math.max(10, menuMinutes()) * 60000));
        saveLogs();
      }
      cur = null;
      showAgain = false;
    }
    if (!cur) { cur = makeCur(null); saveCur(); }
  }
  function rebuild(override) {
    cur = makeCur(override === undefined ? (cur && cur.override) : override);
    pendingRegen = null;
    saveCur();
  }
  function finishSession() {
    if (!anyDone()) { toast("1つ以上「完了」にすると記録できます"); return; }
    stopRest();
    const session = sessionOf(cur, Date.now());
    logs.push(session);
    saveLogs();
    lastSummary = session;
    selDay = session.date;
    calMonth = null;
    cur = null;
    showAgain = false;
    ensureToday();
    switchTab("log");
  }
  // 別の種目に入れ替え（同じ部位の、使える種目を順番に）
  function swapItem(i) {
    const it = cur.items[i];
    const ex = EX[it.exId];
    const pool = it.part === "cardio" ? CARDIO_EX.map((id) => EX[id]).filter(usable)
      : [...new Set(KEYS.flatMap((k) => MENUS[k].slots).filter((s) => s.part === it.part).flatMap((s) => s.ex))]
        .map((id) => EX[id]).filter((e) => usable(e) && (e.id === ex.id || !cur.items.some((x) => x.exId === e.id)));
    if (pool.length < 2) { toast(`ほかに入れ替えられる${PART_NAMES[it.part]}の種目がありません`); return; }
    const next = pool[(pool.findIndex((e) => e.id === ex.id) + 1) % pool.length];
    cur.items[i] = it.part === "cardio" ? { ...it, exId: next.id } : makeItem(next, it.part, it.role, it.sets.length, it.optional);
    saveCur();
    renderMenu();
    toast(`${ex.name} → ${next.name}`);
  }

  // ── アドバイス（体重と重さの変化から） ──
  function advice() {
    const out = [];
    // 2〜3週間、体重が変わらない → 有酸素を週1回増やすか食事を見直す
    const b = body.filter((r) => r.weight != null).sort((x, y) => (x.date < y.date ? -1 : 1));
    if (b.length >= 2) {
      const last = b[b.length - 1];
      const past = b.filter((r) => daysBetween(r.date, last.date) >= 14 && daysBetween(r.date, last.date) <= 24).pop();
      if (past) {
        const n = daysBetween(past.date, last.date);
        const dw = last.weight - past.weight;
        if (Math.abs(dw) < 0.3) out.push({ kind: "warn", text: `${n}日間、体重が変わっていません → 有酸素を週1回増やすか、食事を見直しましょう` });
        else if (dw <= -0.5) out.push({ kind: "good", text: `体重 ${fmtKg(dw)}kg（${n}日前より）` });
      }
    }
    // メイン種目の重さが落ちてきた → 有酸素を減らす
    const drops = [];
    EXERCISES.filter((e) => !e.old && weighted(e) && e.part !== "abs" && !e.acc).forEach((e) => {
      const h = perfHistory(e.id, 4);
      if (h.length < 3) return;
      const best = (x) => Math.max(...x.it.sets.map((s) => s.w || 0));
      const now = best(h[0]);
      const before = Math.max(...h.slice(1).map(best));
      if (now < before - 1e-6) drops.push(e.name);
    });
    if (drops.length >= 2) out.push({ kind: "warn", text: `重さが落ちてきています（${drops.slice(0, 3).join("・")}）→ 有酸素の量を減らしましょう` });
    return out;
  }

  // ── 休憩タイマー（セットを完了すると自動で始まる。終わったら音・振動・通知） ──
  const timer = { end: 0, total: 1, id: 0, beeped: false, nudged: false, i: -1 };
  let audioCtx = null;
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) { audioCtx = null; }
  }
  function beep(n = 2) {
    if (!audioCtx) return;
    try {
      for (let k = 0; k < n; k++) {
        const t0 = audioCtx.currentTime + k * 0.25;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0);
        o.stop(t0 + 0.2);
      }
    } catch (e) { /* 鳴らせなくても続ける */ }
  }
  // 通知（許可されている時だけ）。アプリ版はサービスワーカー経由で出す
  function notify(title, text) {
    try {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then((r) => r.showNotification(title, { body: text, icon: "icons/icon-192.png", tag: "spotter" })).catch(() => {});
      } else new Notification(title, { body: text, tag: "spotter" });
    } catch (e) { /* 通知できなくても続ける */ }
  }
  function alarm(title, text) {
    beep(3);
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { /* 対応していない端末 */ }
    if (document.hidden) notify(title, text);
  }
  const fmtSec = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  // 休憩中に出す「次にやること」
  function nextText() {
    const k = cur ? cur.items.findIndex((x) => x.part !== "cardio" && !itemDone(x)) : -1;
    if (k < 0) return cur && cur.items.some((x) => x.part === "cardio" && !itemDone(x)) ? "次：有酸素" : "";
    const it = cur.items[k];
    const s = it.sets.findIndex((x) => !x.done);
    const st = it.sets[s];
    return `次：${EX[it.exId].name} ${s + 1}セット目${st.w != null ? ` ${fmtKg(st.w)}kg` : ""} × ${st.r}${it.rx.unit === "sec" ? "秒" : "回"}`;
  }
  function startRest(i, j) {
    const it = cur.items[i];
    const ex = EX[it.exId];
    const sec = (REST_SEC[ex.kind] || 90) + (it.restExtra || 0);
    Object.assign(timer, { end: Date.now() + sec * 1000, total: sec, beeped: false, nudged: false, i });
    const st = it.sets[j];
    $("#timerAsk").hidden = !(st && st.t != null && st.r < st.t); // 目標に届かなかった → 次の休憩を30秒のばす提案
    $(".timer-label").textContent = `休憩 ${fmtSec(sec)}`;
    $("#timerNext").textContent = nextText();
    const el = $("#timer");
    el.hidden = false;
    el.classList.remove("over", "late");
    clearInterval(timer.id);
    timer.id = setInterval(tickRest, 250);
    tickRest();
  }
  function stopRest() {
    clearInterval(timer.id);
    const el = $("#timer");
    if (el) { el.hidden = true; el.classList.remove("over", "late"); }
  }
  function tickRest() {
    const left = Math.round((timer.end - Date.now()) / 1000);
    const el = $("#timer");
    $("#timerTime").textContent = (left < 0 ? "+" : "") + fmtSec(Math.abs(left));
    $("#timerBar").style.width = `${Math.max(0, Math.min(100, (left / timer.total) * 100))}%`;
    el.classList.toggle("over", left <= 0);
    if (left <= 0 && !timer.beeped) {
      timer.beeped = true;
      $(".timer-label").textContent = "休憩終了";
      alarm("休憩終了", nextText() || "次のセットを始めましょう");
    }
    // 5分以上あいたら再開を促す
    if (left <= -300 && !timer.nudged) {
      timer.nudged = true;
      el.classList.add("late");
      $(".timer-label").textContent = "5分たちました。再開しましょう";
      alarm("再開しましょう", "休憩が5分をこえました");
    }
    if (left < -1800) stopRest();
  }

  // ── 毎日の早歩き（スタートで10分タイマー。夕方までにしていなければ促す） ──
  const walkedToday = () => !!walks[todayIso()];
  const walk = { end: 0, id: 0 };
  function startWalk() {
    walk.end = Date.now() + WALK.min * 60000;
    clearInterval(walk.id);
    walk.id = setInterval(tickWalk, 500);
    tickWalk();
  }
  function stopWalk() { clearInterval(walk.id); walk.end = 0; }
  function tickWalk() {
    const left = Math.round((walk.end - Date.now()) / 1000);
    const el = $("#walkTime");
    if (el) el.textContent = fmtSec(Math.max(0, left));
    if (left <= 0) {
      stopWalk();
      walks[todayIso()] = WALK.min;
      saveWalks();
      alarm("早歩き 完了", `${WALK.min}分歩きました`);
      if (tab === "menu") renderMenu();
    }
  }
  function checkSteps() {
    if (new Date().getHours() < 17 || walkedToday()) return;
    if (load(LS.nudge, "") === todayIso()) return;
    save(LS.nudge, todayIso());
    notify("今日の早歩きがまだです", `${WALK.min}分、${WALK.speed}で歩きましょう`);
  }

  let toastTimer = 0;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  // ── 描画：今日のメニュー ──
  const chip = (act, val, label, on) => `<button type="button" class="chip" data-act="${act}" data-v="${esc(val)}" aria-pressed="${on}">${label}</button>`;
  const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const GEAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>';

  function weightOptions(sel, step) {
    let h = `<option value=""${sel == null ? " selected" : ""}>—</option>`;
    const max = Math.max(step >= 2.5 ? 200 : 50, (sel || 0) + 20);
    for (let w = step; w <= max + 1e-9; w += step) {
      const v = Math.round(w * 10) / 10;
      h += `<option value="${v}"${sel != null && Math.abs(sel - v) < 1e-6 ? " selected" : ""}>${fmtKg(v)}</option>`;
    }
    if (sel != null && Math.abs(Math.round(sel / step) * step - sel) > 1e-6) h += `<option value="${sel}" selected>${fmtKg(sel)}</option>`;
    return h;
  }
  function numOptions(from, to, stepN, sel) {
    let h = "";
    for (let v = from; v <= to; v += stepN) h += `<option value="${v}"${v === sel ? " selected" : ""}>${v}</option>`;
    if (sel != null && (sel < from || sel > to)) h += `<option value="${sel}" selected>${sel}</option>`;
    return h;
  }
  function itemWeight(it) {
    const next = it.sets.find((x) => !x.done) || it.sets[it.sets.length - 1];
    return next ? next.w : null;
  }
  const unitOf = (it) => (it.rx.unit === "sec" ? "秒" : it.rx.unit === "min" ? "分" : "回");
  function loadHTML(it, ex) {
    if (!weighted(ex)) return `<span class="ex-load bw">自重</span>`;
    const w = itemWeight(it);
    if (w == null) return `<span class="ex-load unset"><b>—</b><small>kg</small></span>`;
    return `<span class="ex-load">${it.sug && it.sug.up ? '<i class="up" title="前回より重く">▲</i>' : ""}<b>${fmtKg(w)}</b><small>kg</small></span>`;
  }
  function selHTML(it, i, j) {
    const st = it.sets[j];
    return it.rx.unit === "sec"
      ? `<select data-act="set-r" data-i="${i}" data-j="${j}" aria-label="${j + 1}セット目の秒数">${numOptions(10, 180, 5, st.r)}</select>`
      : `<select data-act="set-r" data-i="${i}" data-j="${j}" aria-label="${j + 1}セット目の回数">${numOptions(1, 40, 1, st.r)}</select>`;
  }
  function setRowHTML(it, i, j) {
    const st = it.sets[j];
    const wTag = st.done && st.w != null ? `<span class="set-w">${fmtKg(st.w)}kg</span>` : "";
    return `<div class="set-row${st.done ? " done" : ""}">
      <span class="set-no">${j + 1}セット目</span>
      ${wTag}<label class="field">${selHTML(it, i, j)}<span class="u">${unitOf(it)}</span></label>
      <button type="button" class="check" data-act="check" data-i="${i}" data-j="${j}" aria-pressed="${st.done}" aria-label="${j + 1}セット目を${st.done ? "未完了に戻す" : "完了にする"}">${CHECK_SVG}<span>${st.done ? "済" : "完了"}</span></button>
    </div>`;
  }
  const ROLE = { main: "メイン", acc: "補助", extra: "追加", abs: "腹筋", cardio: "筋トレ後の有酸素", "cardio-day": "有酸素", home: "自宅" };

  // 前回と比べた伸び（重さが上がれば ▲kg、同じ重さなら合計回数の差）
  function gain(exId, sets, prevSets, u = "回") {
    if (!prevSets || !sets.length) return null;
    const maxW = (xs) => Math.max(0, ...xs.map((x) => x.w || 0));
    const sumR = (xs) => xs.reduce((a, x) => a + (x.r || 0), 0);
    const dw = maxW(sets) - maxW(prevSets);
    if (Math.abs(dw) > 1e-6) return { up: dw > 0, text: `${dw > 0 ? "▲" : "▼"}${fmtKg(Math.abs(dw))}kg` };
    const dr = sumR(sets) - sumR(prevSets);
    return dr ? { up: dr > 0, text: `${dr > 0 ? "+" : "−"}${Math.abs(dr)}${u}` } : { up: false, text: "前回と同じ" };
  }
  // 種目カード（全部を一度に並べる。どの順番からやってもよい）
  function exCardHTML(it, i) {
    const ex = EX[it.exId];
    const done = itemDone(it);
    const left = it.sets.filter((x) => !x.done).length;
    const h = perfHistory(ex.id, 1)[0];
    const doneSets = it.sets.filter((x) => x.done);
    const u = it.rx.unit === "sec" ? "秒" : "回";
    const g = doneSets.length && h ? gain(ex.id, doneSets, h.it.sets, u) : null;
    const reps = `<b>${Math.max(...it.sets.map((x) => x.r))}</b>${u}<span class="x">×</span><b>${it.sets.length}</b>セット`;
    const head = `<div class="now-head">
        ${thumbHTML(ex.icon)}
        <div class="now-main">
          <span class="now-step">${PART_NAMES[it.part]}${it.optional ? "（省略可）" : ""}${ex.no ? `<span class="mno">${ex.no}番</span>` : ""}<span class="rest-tag">休憩${fmtSec((REST_SEC[ex.kind] || 90) + (it.restExtra || 0))}</span></span>
          <span class="now-name">${esc(ex.name)}</span>
          <span class="reps">${reps}</span>
        </div>
        ${loadHTML(it, ex)}
      </div>`;
    // 前回の記録と、今日の目標（前回より少しでも上）
    const total = it.sets.reduce((a, x) => a + x.r, 0);
    const goal = !h ? "" : it.sug && it.sug.up ? `<span class="goal up">▲${fmtKg(itemWeight(it) - Math.max(...h.it.sets.map((x) => x.w || 0)))}kg</span>`
      : `<span class="goal">目標 ${total}${u}</span>`;
    const prev = `<div class="prev">${h ? `<span class="prev-l">前回 ${dateLabel(h.date)}</span><span class="prev-v">${valHTML({ unit: it.rx.unit, ...h.it })}</span>${goal}` : '<span class="prev-l">はじめて</span>'}</div>`;
    const gainTag = g ? `<span class="gain${g.up ? " up" : ""}">${g.up ? "前回より " : ""}${g.text}</span>` : "";
    const allLabel = done ? "完了（押すと取り消し）" : left < it.sets.length ? `残り${left}セットをまとめて完了` : `${it.sets.length}セットまとめて完了`;
    const allBtn = `<button type="button" class="all-btn" data-act="check-all" data-i="${i}" aria-pressed="${done}">${CHECK_SVG}<span>${allLabel}</span></button>`;
    if (done) return `<section class="now complete" id="ex-${i}">${head}<div class="ex-body">${gainTag}${allBtn}</div></section>`;
    const wRow = weighted(ex) ? `<div class="w-row">
        <span class="w-label">重さ</span>
        <button type="button" class="stp" data-act="w-dec" data-i="${i}" aria-label="重さを1段階下げる">−</button>
        <label class="w-big"><select data-act="w-all" data-i="${i}" aria-label="重さ（kg）">${weightOptions(itemWeight(it), ex.step)}</select><span>kg</span></label>
        <button type="button" class="stp" data-act="w-inc" data-i="${i}" aria-label="重さを1段階上げる">＋</button>
      </div>` : "";
    return `<section class="now" id="ex-${i}">
      ${head}
      <div class="ex-body">
        ${prev}
        ${wRow}
        <div class="sets">${it.sets.map((_, j) => setRowHTML(it, i, j)).join("")}</div>
        ${allBtn}
        <div class="ex-actions">
          <details class="tips"><summary>フォームのコツ</summary><ul>${ex.tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></details>
          <span class="spacer"></span>
          <button type="button" class="mini" data-act="swap" data-i="${i}">別の種目</button>
          <button type="button" class="mini" data-act="add-set" data-i="${i}" aria-label="セットを増やす">＋セット</button>
          ${it.sets.length > 1 ? `<button type="button" class="mini" data-act="del-set" data-i="${i}" aria-label="セットを減らす">−セット</button>` : ""}
          <button type="button" class="mini" data-act="remove" data-i="${i}">外す</button>
        </div>
      </div>
    </section>`;
  }
  // 有酸素のカード（速さの指示・マシンの切り替え・時間の入力・インターバル）
  const speedHTML = (sp) => (sp || []).map(([l, v, u]) => `<span>${l}<b>${v}</b>${u}</span>`).join("");
  const aimText = (rx) => (rx.lo == null ? "" : `目安 <b>${rx.hi && rx.hi !== rx.lo ? `${rx.lo}〜${rx.hi}` : rx.lo}</b>分`);
  function cardioCardHTML(it, i) {
    const ex = EX[it.exId];
    const done = itemDone(it);
    const m = it.sets[0].m;
    const day = it.role === "cardio-day";
    const pick = it.role === "home" ? "" : `<div class="cpick">${CARDIO_EX.map((id) => EX[id]).filter(usable).map((e) => `<button type="button" class="chip" data-act="cardio-pick" data-i="${i}" data-v="${e.id}" aria-pressed="${e.id === it.exId}">${e.no} ${esc(e.name)}</button>`).join("")}</div>`;
    const iv = day && cur.intervalOK ? `<button type="button" class="btn${cur.interval ? " primary" : ""}" data-act="interval">${cur.interval ? "✓ インターバルにする" : "インターバルにする（週1回まで）"}</button>` : "";
    const spd = cur.interval && day ? `<span class="spd iv"><b>30秒 速く → 90秒 ゆっくり を 8〜10本</b></span>` : `<span class="spd">${speedHTML(ex.speed)}</span>`;
    const head = `<div class="now-head">
        ${thumbHTML(ex.icon)}
        <div class="now-main">
          <span class="now-step">${ROLE[it.role]}${day && cur.optional ? "（任意）" : ""}${ex.no ? `<span class="mno">${ex.no}番</span>` : ""}</span>
          <span class="now-name">${esc(ex.name)}</span>
          ${spd}
        </div>
      </div>`;
    const btn = `<button type="button" class="all-btn" data-act="check-all" data-i="${i}" aria-pressed="${done}">${CHECK_SVG}<span>${done ? `${m}分 完了（押すと取り消し）` : `${m}分 完了`}</span></button>`;
    if (done) return `<section class="now complete" id="ex-${i}">${head}<div class="ex-body">${btn}</div></section>`;
    return `<section class="now cardio" id="ex-${i}">
      ${head}
      <div class="ex-body">
        ${pick}
        <div class="set-row"><span class="set-no">時間</span><label class="field"><select data-act="set-m" data-i="${i}" aria-label="やった時間（分）">${numOptions(1, 90, 1, m)}</select><span class="u">分</span></label><span class="aim">${aimText(it.rx)}</span></div>
        ${iv}
        ${btn}
      </div>
    </section>`;
  }
  // 部位ごとの週合計セット数（目標9〜12）。now＝記録済み、plus＝今日の分
  function partChipsHTML(now, plus) {
    return `<div class="pchips">${PART_IDS.map((p) => {
      const a = now[p];
      const b = a + (plus ? plus[p] || 0 : 0);
      const cls = b > WEEK_TARGET[1] ? "over" : b >= WEEK_TARGET[0] ? "ok" : b >= 6 ? "mid" : "low";
      const label = b > WEEK_TARGET[1] ? "多め" : b >= WEEK_TARGET[0] ? "✓" : `あと${WEEK_TARGET[0] - b}`;
      return `<span class="pchip ${cls}"><em>${PARTS[p]}</em><b>${plus && b !== a ? `${a}<i>→</i>${b}` : b}</b><small>${label}</small></span>`;
    }).join("")}</div>`;
  }

  // ── 1週間の予定。前の日は記録、今日から先は予定どおりに進めた場合のアプリの予定（任意の有酸素はやらない前提） ──
  let weekOff = 0; // 0：今週、1：来週
  const WP_LABEL = { cardio: "有酸素", rest: "休み", off: "自宅" };
  function weekPlan(off) {
    const today = todayIso();
    const mon = isoAdd(formatDateISO(mondayOf(new Date())), off * 7);
    const end = isoAdd(mon, 6);
    const doneOnDay = (d) => logs.filter((s) => s.date === d && ["strength", "cardio", "home"].includes(sessionType(s)));
    const plan = {};
    const real = logs;
    logs = logs.slice();
    try {
      for (let d = today; d <= end; d = isoAdd(d, 1)) {
        const done = doneOnDay(d).length > 0;
        if (d === today && done) continue;
        let p;
        if (d === today) p = { type: cur.type, optional: cur.optional, day: cur.day };
        else { p = planFor(d); if (p.type === "strength") p.day = nextKey(); }
        plan[d] = p;
        if (!p.optional && (p.type === "strength" || p.type === "cardio")) logs.push({ v: 6, date: d, type: p.type, day: p.day, items: [] });
      }
    } finally { logs = real; }
    return Array.from({ length: 7 }, (_, k) => {
      const d = isoAdd(mon, k);
      const ss = d <= today ? doneOnDay(d) : [];
      if (ss.length) {
        const st = ss.find((s) => sessionType(s) === "strength");
        const ty = st ? "strength" : ss.some((s) => sessionType(s) === "cardio") ? "cardio" : "off";
        return { d, type: ty, day: st && st.day, done: true };
      }
      if (d < today) return { d, type: "none" };
      return { d, ...plan[d] };
    });
  }
  function weekPlanHTML() {
    const today = todayIso();
    const days = weekPlan(weekOff).map((w) => {
      const isS = w.type === "strength";
      const k = isS ? (w.day ? menuBadge(w.day) : "筋") : w.type === "cardio" ? "有" : w.type === "rest" ? "休" : w.type === "off" ? "家" : "—";
      const label = isS ? (MENUS[w.day] ? MENUS[w.day].name.replace("＋腹", "") : "筋トレ") : w.type === "cardio" && w.optional ? "任意" : WP_LABEL[w.type] || "";
      const dt = isoToDate(w.d);
      const cls = [`t-${w.type}`, w.optional ? "opt" : "", w.d === today ? "wp-today" : w.d < today ? "past" : ""].join(" ");
      return `<li class="wp ${cls}"><span class="wp-dow">${DOW[dt.getDay()]}</span><span class="wp-date">${dt.getDate()}</span><b class="wp-k">${k}${w.done ? "<i>✓</i>" : ""}</b><small>${label}</small></li>`;
    }).join("");
    return `<div class="wplan">
        <div class="wp-head"><b>${weekOff ? "来週" : "今週"}の予定</b><button type="button" class="mini" data-act="wp-week">${weekOff ? "‹ 今週" : "来週 ›"}</button></div>
        <ol class="wp-days">${days}</ol>
      </div>`;
  }

  // 早歩きのカード（速さはこちらで指示、時間は目安を出して本人が入れる。タイマーも使える）
  let walkMin = WALK.min;
  function stepsHTML() {
    const done = walkedToday();
    const running = walk.end > Date.now();
    const got = walks[todayIso()];
    return `<div class="steps${done ? " done" : ""}">
        <div class="st-head"><b>今日の早歩き</b>${done ? `<span class="st-ok">✓ ${got === true ? WALK.min : got}分 完了</span>` : ""}</div>
        <div class="wk-main">${running ? `<span class="wk-big"><b id="walkTime">${fmtSec(Math.max(0, Math.round((walk.end - Date.now()) / 1000)))}</b></span>` : ""}
          <span class="wk-spd"><span class="spd">${speedHTML(EX.home_walk.speed)}</span><small>${WALK.pace}</small></span></div>
        ${done ? `<button type="button" class="link" data-act="walk-undo">取り消す</button>`
          : running ? `<button type="button" class="btn" data-act="walk-stop">やめる</button>`
          : `<div class="set-row"><label class="field"><select data-act="walk-m" aria-label="歩いた時間（分）">${numOptions(1, 60, 1, walkMin)}</select><span class="u">分</span></label><span class="aim">目安 <b>${WALK.min}</b>分</span></div>
            <div class="row-btns"><button type="button" class="btn primary" data-act="walk-done">${walkMin}分 歩いた</button><button type="button" class="btn ghost" data-act="walk-start">${WALK.min}分タイマー</button></div>`}
      </div>`;
  }

  function renderMenu() {
    ensureToday();
    const now = new Date();
    const today = todayIso();
    const t = cur.type;
    const doneItems = cur.items.filter(itemDone).length;
    const doneToday = logs.some((s) => s.date === today && ["strength", "cardio", "home"].includes(sessionType(s)));
    const badge = t === "strength" ? menuBadge(cur.day) : t === "cardio" ? "有" : t === "rest" ? "休" : "家";
    const title = t === "strength" ? `<span class="dh-parts">筋トレ　${menuName(cur.day)}</span>` : `<span class="dh-parts">${t === "cardio" ? "有酸素だけ" : DAY_TYPES[t]}の日</span>`;
    const tags = [cur.mode && MODES[cur.mode] && cur.mode !== "normal" ? MODES[cur.mode].name : "", cur.optional ? "任意" : "", cur.override ? "手で変更" : ""].filter(Boolean).map((x) => `<span class="dh-mode">${x}</span>`).join("");
    // 夕方になっても歩数が少ない日は、いちばん上で促す
    const walkNudge = now.getHours() >= 17 && !walkedToday() ? `<p class="nudge">夕方です。早歩き${WALK.min}分（${WALK.speed}）がまだです</p>` : "";
    // 週1回：体重を測る日
    const lastBody = body.length ? body.map((b) => b.date).sort().pop() : null;
    const bodyNudge = !lastBody || daysBetween(lastBody, today) >= 7 ? `<button type="button" class="nudge link-like" data-act="goto-body">今日は体重を測る日 ›</button>` : "";
    const adv = advice().map((a) => `<p class="adv ${a.kind}">${esc(a.text)}</p>`).join("");

    const eqCount = EQUIP.filter((q) => settings.equip[q.id]).length;
    const eqTile = (q) => `<button type="button" class="eq-tile" data-act="eq-toggle" data-v="${q.id}" aria-pressed="${!!settings.equip[q.id]}" aria-label="${esc(q.name)}">${pictoSVG(q.icon)}<span>${q.no}</span></button>`;
    const cond = !condOpen ? "" : `<div class="cond">
        <div class="ctl-col"><span class="ctl-label">1回の時間</span><div class="chips">${MINUTES.map((m) => chip("minutes", m, `<span class="n">${m}</span>分`, settings.minutes === m)).join("")}</div></div>
        <div class="ctl-col"><span class="ctl-label">使える器具 <b>${eqCount}</b>/${EQUIP.length}</span>
          <div class="eq-grid">${EQUIP.map(eqTile).join("")}</div></div>
      </div>`;

    const card = (it, i) => (it.part === "cardio" ? cardioCardHTML(it, i) : exCardHTML(it, i));
    const orderIdx = cur.items.map((_, i) => i).sort((a, b) => itemDone(cur.items[a]) - itemDone(cur.items[b]) || (cur.items[a].part === "cardio") - (cur.items[b].part === "cardio") || a - b);
    let main = "";
    if (doneToday && !anyDone() && !showAgain) {
      const tm = planFor(isoAdd(today, 1));
      main = `<div class="done-today"><b>✓ 今日の分は記録済み</b><span>明日の予定：${DAY_TYPES[tm.type]}${tm.type === "strength" ? `（${menuName(nextKey())}）` : tm.optional ? "（任意）" : ""}</span>
        <div class="row-btns"><button type="button" class="btn" data-act="see-today">記録を見る</button><button type="button" class="btn ghost" data-act="show-again">もう少しやる</button></div></div>`;
    } else if (t === "rest") {
      main = `<div class="rest-day"><b>今日は体を休める日</b><span>早歩き${WALK.min}分だけやりましょう</span></div>`;
    } else if (cur.items.length) {
      main = `<div class="list">${orderIdx.map((i) => card(cur.items[i], i)).join("")}</div>
        <button type="button" class="btn primary block" data-act="finish">記録して終える</button>`;
    } else {
      main = `<div class="empty">今日できる種目がありません。下の「時間・器具」で使える器具を選んでください。</div>`;
    }
    const showList = cur.items.length && t !== "rest" && !(doneToday && !anyDone() && !showAgain);
    const jump = showList ? `<nav class="jump" aria-label="今日の種目">${cur.items.map((it, i) => {
      const ex = EX[it.exId];
      const d = itemDone(it);
      const n = it.sets.filter((x) => x.done).length;
      const isC = it.part === "cardio";
      return `<button type="button" class="jp${d ? " done" : n ? " doing" : ""}" data-act="jump" data-i="${i}" aria-label="${esc(ex.name)}へ">
          <span class="jp-ic">${pictoSVG(ex.icon)}${d ? '<i class="jp-ok">✓</i>' : ""}</span>
          <span class="jp-l">${isC ? "有酸素" : PART_NAMES[it.part]}</span>
          <span class="jp-n">${isC ? `<b>${it.sets[0].m}</b>分` : `<b>${n}</b>/${it.sets.length}`}</span>
        </button>`;
    }).join("")}</nav>` : "";
    const offBtn = t === "off" ? `<button type="button" class="mini" data-act="off-undo">やっぱり行ける</button>`
      : t !== "rest" && !doneToday && !anyDone() ? `<button type="button" class="mini" data-act="off-today">今日は行けない</button>` : "";

    $("#view-menu").innerHTML = `
      ${jump}
      <div class="day-hero">
        <div class="dh-row"><span class="dh-date">${now.getMonth() + 1}月${now.getDate()}日（${DOW[now.getDay()]}）</span>${showList ? `<span class="dh-sum"><b>${doneItems}</b>/${cur.items.length} 完了<br>約${menuMinutes()}分${curSets() ? ` · ${curSets()}セット` : ""}</span>` : ""}</div>
        <div class="dh-title"><b class="key t-${t}">${badge}</b>${title}${tags}</div>
        <div class="dh-check"><span class="dh-prev">${esc(cur.why)}</span>${offBtn}</div>
      </div>
      ${weekPlanHTML()}
      ${walkNudge}${bodyNudge}${adv}
      ${cur.notes && cur.notes.length ? `<ul class="notes">${cur.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${pendingRegen ? `<div class="notice"><span>チェック済みのセットがあります。作り直すと消えます。</span>
        <div class="row-btns"><button type="button" class="btn primary" data-act="regen-yes">作り直す</button><button type="button" class="btn ghost" data-act="regen-no">このまま続ける</button></div></div>` : ""}
      ${main}
      ${stepsHTML()}
      <button type="button" class="opts" data-act="cond" aria-expanded="${condOpen}">${GEAR_SVG}<span>時間 ${settings.minutes}分・器具 ${eqCount}/${EQUIP.length}</span><em>${condOpen ? "閉じる" : "変える"}</em></button>
      ${cond}`;
  }

  // ── 描画：記録 ──
  let selDay = null; // 記録タブで見ている日
  let calMonth = null; // カレンダーで見ている月（1日）
  const isStrength = (s) => s.items.some((it) => EX[it.exId] && EX[it.exId].part !== "cardio");

  function valHTML(it) {
    if (it.unit === "min") return `<b>${it.sets.reduce((a, x) => a + x.m, 0)}</b>分`;
    const reps = it.sets.map((x) => x.r).join("・") + (it.unit === "sec" ? "秒" : "回");
    const ws = it.sets.map((x) => x.w).filter((w) => w != null);
    return ws.length ? `<b>${fmtKg(Math.max(...ws))}</b>kg × ${reps}` : reps;
  }
  // 同じ種目の前回と比べた変化（重さが変わればkg、同じなら合計回数）
  function diffHTML(it, beforeIdx) {
    if (it.unit === "min") return "";
    let prev = null;
    for (let k = beforeIdx - 1; k >= 0 && !prev; k--) prev = logs[k].items.find((x) => x.exId === it.exId && x.sets.length) || null;
    if (!prev) return '<span class="diff new">初</span>';
    const maxW = (x) => Math.max(0, ...x.sets.map((s) => s.w || 0));
    const sumR = (x) => x.sets.reduce((a, s) => a + (s.r || 0), 0);
    const dw = maxW(it) - maxW(prev);
    if (Math.abs(dw) > 1e-6) return `<span class="diff ${dw > 0 ? "up" : "down"}">${dw > 0 ? "▲" : "▼"}${fmtKg(Math.abs(dw))}kg</span>`;
    const dr = sumR(it) - sumR(prev);
    if (dr) return `<span class="diff ${dr > 0 ? "up" : "down"}">${dr > 0 ? "+" : "−"}${Math.abs(dr)}${it.unit === "sec" ? "秒" : "回"}</span>`;
    return '<span class="diff same">→</span>';
  }
  // やった量に合わせた赤。r＝0（ほんの少し）〜1（たくさん）で、薄いピンク→濃い赤
  const heatColor = (r) => `hsl(4 86% ${Math.round(86 - 50 * Math.max(0, Math.min(1, r)))}%)`;
  // 期間（今週／今月）のまとめ：体の図の赤の濃さ＝その部位をやったセット数
  function periodHTML(today) {
    const start = logPeriod === "week" ? mondayOf(today) : new Date(today.getFullYear(), today.getMonth(), 1);
    const end = logPeriod === "week" ? addDays(start, 6) : new Date(start.getFullYear(), start.getMonth() + 1, 0);
    const ss = logs.filter((s) => s.date >= formatDateISO(start) && s.date <= formatDateISO(end));
    const score = {};
    let sets = 0;
    ss.forEach((s) => s.items.forEach((it) => {
      const mu = EX_MUSCLES[it.exId];
      if (!mu) return;
      const n = it.sets.length;
      sets += n;
      mu.main.forEach((m) => { score[m] = (score[m] || 0) + n; });
      mu.sub.forEach((m) => { score[m] = (score[m] || 0) + n / 2; });
    }));
    // 1週間で12セット（目標の上限）をいちばん濃い赤に。今月はその月の週の数だけ多く
    const weeks = logPeriod === "week" ? 1 : (daysBetween(formatDateISO(start), formatDateISO(end)) + 1) / 7;
    const full = WEEK_TARGET[1] * weeks;
    const heat = {};
    Object.entries(score).forEach(([m, v]) => { heat[m] = heatColor(v / full); });
    const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
    const tabBtn = (v, label) => `<button type="button" data-act="period" data-v="${v}" aria-pressed="${logPeriod === v}">${label}</button>`;
    return `<div class="psum">
        <div class="psum-head"><div class="tabs2" role="group" aria-label="まとめる期間">${tabBtn("week", "今週")}${tabBtn("month", "今月")}</div><span class="psum-range">${md(start)}〜${md(end)} · <b>${new Set(ss.map((s) => s.date)).size}</b>日</span></div>
        ${bodyMapHTML(heat, "big")}
        <div class="heat-scale"><span>少し</span><i style="background:linear-gradient(90deg, ${heatColor(0)}, ${heatColor(0.5)}, ${heatColor(1)})"></i><span>${Math.round(full)}セット以上</span></div>
        <div class="heat-legend"><span><i class="lg none"></i>やっていない</span></div>
        ${sets ? "" : `<p class="hint center">この期間の筋トレの記録はまだありません。</p>`}
      </div>`;
  }
  // 部位別の週合計セット数（今週・先週）
  function weekPartsHTML(today) {
    const mon = mondayOf(today);
    const thisW = partSets(formatDateISO(mon), formatDateISO(addDays(mon, 6)));
    const prevW = partSets(formatDateISO(addDays(mon, -7)), formatDateISO(addDays(mon, -1)));
    return `<div class="wk">
        <div class="wk-head"><b>部位別セット数</b><span>目標 各${WEEK_TARGET[0]}〜${WEEK_TARGET[1]}</span></div>
        <div class="wk-row"><span class="wk-label">今週</span>${partChipsHTML(thisW)}</div>
        <div class="wk-row"><span class="wk-label">先週</span>${logs.some((s) => s.date >= formatDateISO(addDays(mon, -7)) && s.date < formatDateISO(mon)) ? partChipsHTML(prevW) : '<span class="hint">記録なし</span>'}</div>
      </div>`;
  }

  // 1回ぶんの総重量（重さ×回数の合計）
  const volumeOf = (s) => s.items.reduce((a, it) => a + it.sets.reduce((b, x) => b + (x.w || 0) * (x.r || 0), 0), 0);
  const fmtNum = (n) => Math.round(n).toLocaleString("ja-JP");
  // 週ごとの総重量（直近8週）。今週が先週より増えていれば ▲%
  function growthHTML(today) {
    const mon = mondayOf(today);
    const weeks = Array.from({ length: 8 }, (_, k) => {
      const from = addDays(mon, -7 * (7 - k));
      const fromIso = formatDateISO(from);
      const toIso = formatDateISO(addDays(from, 6));
      return { from, v: logs.filter((s) => s.date >= fromIso && s.date <= toIso).reduce((a, s) => a + volumeOf(s), 0) };
    });
    if (!weeks.some((w) => w.v)) return "";
    const max = Math.max(...weeks.map((w) => w.v));
    const nowV = weeks[7].v;
    // 先週の同じ曜日までと比べる（週の途中で「減った」と出ないように）
    const dayIdx = (today.getDay() + 6) % 7;
    const pFrom = formatDateISO(addDays(mon, -7));
    const pTo = formatDateISO(addDays(mon, -7 + dayIdx));
    const prevV = logs.filter((s) => s.date >= pFrom && s.date <= pTo).reduce((a, s) => a + volumeOf(s), 0);
    const diff = prevV ? Math.round(((nowV - prevV) / prevV) * 100) : null;
    const bars = weeks.map((w, k) => `<div class="vb${k === 7 ? " now" : ""}"><i style="height:${max ? Math.max(3, Math.round((w.v / max) * 100)) : 0}%"></i><span>${w.from.getMonth() + 1}/${w.from.getDate()}</span></div>`).join("");
    // 種目ごとの伸び：はじめて記録した時 → いま（重さ。自重は回数）
    const byEx = {};
    logs.forEach((s) => s.items.forEach((it) => {
      const ex = EX[it.exId];
      if (!ex || ex.old || ex.part === "cardio" || !it.sets.length) return; // 有酸素は伸びの一覧に入れない
      const val = weighted(ex) ? Math.max(...it.sets.map((x) => x.w || 0)) : Math.max(...it.sets.map((x) => x.r || 0));
      (byEx[it.exId] = byEx[it.exId] || []).push({ date: s.date, val });
    }));
    const rows = Object.entries(byEx).sort((a, b) => (b[1].at(-1).date > a[1].at(-1).date ? 1 : -1)).slice(0, 8).map(([id, pts]) => {
      const ex = EX[id];
      const u = weighted(ex) ? "kg" : "回";
      const a = pts[0].val;
      const z = pts.at(-1).val;
      const best = Math.max(...pts.map((p) => p.val));
      const lo = Math.min(...pts.map((p) => p.val));
      const W = 72, H = 22;
      const xy = pts.map((p, k) => `${pts.length > 1 ? Math.round((k / (pts.length - 1)) * W) : W / 2},${Math.round(H - 2 - (best > lo ? ((p.val - lo) / (best - lo)) * (H - 4) : (H - 4) / 2))}`).join(" ");
      const d = z - a;
      return `<li><span class="pr-name">${esc(ex.name)}</span>
          <svg class="spark" viewBox="-2 0 ${W + 4} ${H}" aria-hidden="true"><polyline points="${xy}"/><circle cx="${xy.split(" ").at(-1).split(",")[0]}" cy="${xy.split(" ").at(-1).split(",")[1]}" r="2.5"/></svg>
          <span class="pr-val">${fmtKg(a)}→<b>${fmtKg(z)}</b>${u}</span>
          <span class="pr-d${d > 0 ? " up" : ""}">${d > 0 ? `▲${fmtKg(d)}` : d < 0 ? `▼${fmtKg(-d)}` : "±0"}</span></li>`;
    }).join("");
    return `<div class="grow">
        <div class="grow-head"><b>総重量の推移</b><span>今週 <b>${fmtNum(nowV)}</b>kg${diff != null ? ` <em class="${diff >= 0 ? "up" : ""}">先週の同じ曜日まで比 ${diff >= 0 ? "▲" : "▼"}${Math.abs(diff)}%</em>` : ""}</span></div>
        <div class="vbars">${bars}</div>
        <div class="grow-head"><b>種目ごとの伸び</b><span>はじめ→いま</span></div>
        <ul class="prs">${rows}</ul>
      </div>`;
  }

  // 体重（週1回、同じ条件で）
  function bodyHTML() {
    const b = body.filter((r) => r.weight != null).sort((x, y) => (x.date < y.date ? 1 : -1));
    const rows = b.slice(0, 6).map((r, k) => {
      const p = b[k + 1];
      const d = (a, c) => (a != null && c != null ? a - c : null);
      const dw = p ? d(r.weight, p.weight) : null;
      const tag = (v, u) => (v == null ? "" : `<em class="${v < 0 ? "down" : v > 0 ? "up" : ""}">${v > 0 ? "+" : v < 0 ? "−" : "±"}${fmtKg(Math.abs(v))}${u}</em>`);
      return `<li><span class="bd-date">${dateLabel(r.date)}</span><span><b>${fmtKg(r.weight)}</b>kg${tag(dw, "")}</span></li>`;
    }).join("");
    return `<div class="bodyrec" id="bodyrec">
        <div class="grow-head"><b>体重</b><span>週1回・朝トイレのあと食事の前に</span></div>
        <div class="bd-in">
          <label><input type="number" inputmode="decimal" step="0.1" id="inWeight" placeholder="体重"><span>kg</span></label>
          <button type="button" class="btn primary" data-act="body-save">記録</button>
        </div>
        ${rows ? `<ul class="bd-list">${rows}</ul>` : ""}
      </div>`;
  }
  function adviceHTML() {
    const a = advice();
    return a.length ? `<div class="advs">${a.map((x) => `<p class="adv ${x.kind}">${esc(x.text)}</p>`).join("")}</div>` : "";
  }
  // 今週の内訳（筋トレ・有酸素の日数と、歩数の平均）
  function weekSummaryHTML(today) {
    const mon = formatDateISO(mondayOf(today));
    const tIso = formatDateISO(today);
    const days = [];
    for (let d = mon; d <= tIso; d = isoAdd(d, 1)) days.push(d);
    const st = days.filter(strengthOn).length;
    const ca = days.filter((d) => typesOn(d).has("cardio")).length;
    const wd = days.filter((d) => walks[d]).length;
    return `<div class="wsum">
        <span><b>${st}</b>日<small>筋トレ</small></span>
        <span><b>${ca}</b>日<small>有酸素</small></span>
        <span><b>${wd}</b>日<small>早歩き</small></span>
      </div>`;
  }

  function renderLog() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tIso = formatDateISO(today);
    const byDate = {};
    logs.forEach((s) => { (byDate[s.date] = byDate[s.date] || []).push(s); });
    if (!selDay) selDay = byDate[tIso] || !logs.length ? tIso : logs[logs.length - 1].date;

    // 月のカレンダー（月曜はじまり）。やった日は黒、重さ・回数を上げた日は ▲
    if (!calMonth) { const [y, m] = selDay.split("-").map(Number); calMonth = new Date(y, m - 1, 1); }
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const monthKey = formatDateISO(first).slice(0, 7);
    const monthDays = Object.keys(byDate).filter((d) => d.startsWith(monthKey));
    const isThisMonth = monthKey === tIso.slice(0, 7);
    const firstLog = logs.length ? logs.map((s) => s.date).sort()[0].slice(0, 7) : tIso.slice(0, 7);
    let cells = ["月", "火", "水", "木", "金", "土", "日"].map((d) => `<span class="cal-dow">${d}</span>`).join("");
    for (let k = 0; k < lead; k++) cells += '<span class="cal-blank"></span>';
    for (let n = 1; n <= daysIn; n++) {
      const d = new Date(first.getFullYear(), first.getMonth(), n);
      const iso = formatDateISO(d);
      const ss = byDate[iso];
      const daySets = ss ? ss.reduce((a, s) => a + s.items.reduce((b, it) => b + (EX[it.exId] && EX[it.exId].part !== "cardio" ? it.sets.length : 0), 0), 0) : 0;
      const kindCls = !ss ? "" : daySets ? "k-heat" : "k-c";
      const r = Math.min(1, daySets / 16);
      const heatStyle = daySets ? ` style="background:${heatColor(r)};border-color:${heatColor(r)};color:${r > 0.45 ? "#fff" : "#5a0a05"}"` : "";
      const keys = ss ? [...new Set(ss.filter((s) => s.v >= 3 && ALL_KEYS.includes(s.day) && !s.light && sessionType(s) === "strength").map((s) => menuBadge(s.day)))].join("") : "";
      const up = ss && ss.some((s) => s.items.some((it) => diffHTML(it, logs.indexOf(s)).includes('class="diff up"')));
      const cls = ["cal-day", kindCls, iso === tIso ? "today" : "", iso === selDay ? "sel" : ""].filter(Boolean).join(" ");
      cells += d > today ? `<span class="cal-day future">${n}</span>`
        : `<button type="button" class="${cls}"${heatStyle} data-act="day" data-d="${iso}" aria-pressed="${iso === selDay}" aria-label="${dateLabel(iso)}${ss ? ` ${daySets}セット` : ""}${up ? " 記録更新" : ""}"><span>${n}</span>${keys ? `<i class="cal-key">${keys}</i>` : ""}${up ? '<i class="cal-up">▲</i>' : ""}</button>`;
    }

    // 選んだ日の記録
    const daySessions = byDate[selDay] || [];
    let day;
    if (!daySessions.length) {
      day = `<div class="day empty-day"><div class="day-head"><b>${dateLabel(selDay)}</b></div><p>この日の記録はありません。</p></div>`;
    } else {
      const rows = [];
      daySessions.forEach((s) => {
        const idx = logs.indexOf(s);
        s.items.forEach((it) => {
          const ex = EX[it.exId];
          rows.push(`<li><span class="dl-main"><span class="dl-name">${esc(ex ? ex.name : it.exId)}</span><span class="dl-val">${valHTML(it)}</span></span>${diffHTML(it, idx)}</li>`);
        });
      });
      const keys = [...new Set(daySessions.map((s) => { const ty = sessionType(s); return ty === "home" ? "自宅" : ty === "cardio" ? (s.interval ? "インターバル" : "有酸素") : s.v >= 3 && ALL_KEYS.includes(s.day) ? menuName(s.day) : ""; }).filter(Boolean))];
      const sets = daySessions.reduce((a, s) => a + s.items.reduce((b, it) => b + (it.unit === "min" ? 0 : it.sets.length), 0), 0);
      const mins = daySessions.reduce((a, s) => a + Math.max(1, Math.round((s.endedAt - s.startedAt) / 60000)), 0);
      const del = pendingDelete === selDay
        ? `<span class="del-confirm">この日の記録を消しますか？ <button type="button" class="mini warn" data-act="del-yes">消す</button><button type="button" class="mini" data-act="del-no">やめる</button></span>`
        : `<button type="button" class="link" data-act="del-ask">この日の記録を削除</button>`;
      day = `<div class="day">
        <div class="day-head"><b>${dateLabel(selDay)}</b><span>${keys.join("・")} · ${sets}セット${mins < 240 ? ` · ${mins}分` : ""}</span></div>
        <ul class="day-list">${rows.join("")}</ul>
        <div class="day-foot">${del}</div>
      </div>`;
    }

    // 記録した直後：前回より伸びた種目を出す
    let summary = "";
    if (lastSummary) {
      const idx = logs.indexOf(lastSummary);
      const ups = lastSummary.items.map((it) => {
        let prev = null;
        for (let k = idx - 1; k >= 0 && !prev; k--) prev = logs[k].items.find((x) => x.exId === it.exId && x.sets.length) || null;
        const g = prev ? gain(it.exId, it.sets, prev.sets) : null;
        return g && g.up ? `<li>${esc(EX[it.exId] ? EX[it.exId].name : it.exId)} <b>${g.text}</b></li>` : "";
      }).filter(Boolean);
      summary = `<div class="summary"><b>✓ おつかれさまでした</b>${ups.length ? `<span class="sum-up">前回より伸びた ${ups.length}種目</span><ul>${ups.join("")}</ul>` : ""}</div>`;
    }
    // 記録したばかりの時は、その日の中身をいちばん上に
    $("#view-log").innerHTML = `
      ${summary}
      ${lastSummary ? day : ""}
      ${adviceHTML()}
      ${weekSummaryHTML(today)}
      ${bodyHTML()}
      ${growthHTML(today)}
      ${periodHTML(today)}
      <div class="cal">
        <div class="cal-head">
          <button type="button" class="cal-nav" data-act="cal-prev" aria-label="前の月"${monthKey <= firstLog ? " disabled" : ""}>‹</button>
          <b>${first.getFullYear()}年${first.getMonth() + 1}月</b>
          <button type="button" class="cal-nav" data-act="cal-next" aria-label="次の月"${isThisMonth ? " disabled" : ""}>›</button>
          <span class="cal-count"><b>${monthDays.length}</b>日</span>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend">
          <span><i class="sw" style="background:linear-gradient(90deg, ${heatColor(0.1)}, ${heatColor(1)})"></i>セット数</span>
          <span><i class="cal-up">▲</i>記録アップ</span>
        </div>
      </div>
      ${lastSummary ? "" : day}`;
  }

  // ── 描画：設定 ──
  function renderSettings() {
    ensureToday();
    const mc = EQUIP.map((q) => `<label class="mc"><input type="checkbox" data-act="equip" data-v="${q.id}"${settings.equip[q.id] ? " checked" : ""}>${thumbHTML(q.icon)}<span class="mc-tick">${CHECK_SVG}</span><span class="mc-name">${q.no} ${esc(q.name)}</span></label>`).join("");
    const menus = KEYS.map((k) => `<li><b>${MENUS[k].badge}</b><span><em>${MENUS[k].name}</em>${MENUS[k].slots.map((sl) => `${esc(EX[sl.ex[0]].name.replace(/（.*）/, ""))}×${sl.sets}`).join("／")}／有酸素${MENUS[k].cardio[0]}${MENUS[k].cardio[1] > MENUS[k].cardio[0] ? `〜${MENUS[k].cardio[1]}` : ""}分</span></li>`).join("")
      + `<li><b>有</b><span><em>有酸素だけの日</em>${EX.treadmill.name} 速度${EX.treadmill.speed[0][1]}・傾斜${EX.treadmill.speed[1][1]}／${CARDIO_DAY[0]}分</span></li>`;
    const auto = planFor(todayIso());
    const dtypes = [["auto", `自動（${DAY_TYPES[auto.type]}）`], ["strength", "筋トレ"], ["cardio", "有酸素"], ["rest", "休む"]]
      .map(([k, label]) => chip("dtype", k, label, k === "auto" ? !cur.override : cur.override === k)).join("");
    const perm = "Notification" in window ? Notification.permission : "unsupported";
    $("#view-settings").innerHTML = `
      <div class="card"><h3>今日の内容</h3><div class="chips">${dtypes}</div></div>
      <div class="card"><h3>メニュー（上半身→下半身→全身の順）</h3><ul class="menu-def">${menus}</ul></div>
      <div class="card"><h3>1回の時間</h3><div class="chips">${MINUTES.map((m) => chip("minutes", m, `<span class="n">${m}</span>分`, settings.minutes === m)).join("")}</div></div>
      <div class="card"><h3>通知（休憩の終わり・早歩き）</h3>
        ${perm === "granted" ? '<p class="fine">✓ オン</p>' : perm === "unsupported" ? '<p class="fine">この画面では通知を使えません（アプリ版で使えます）</p>' : `<button type="button" class="btn" data-act="notify-on">通知をオンにする</button>`}</div>
      <div class="card"><h3>使える器具</h3><div class="machines">${mc}</div></div>
      <div class="card"><h3>データ</h3>
        <p class="fine">この端末のブラウザに保存（${logs.length}回分）</p>
        <div class="row-btns"><button type="button" class="btn" data-act="export">記録を書き出す</button><button type="button" class="btn" data-act="import-open">記録を読み込む</button></div>
        ${xfer === "export" ? `<textarea class="xfer" readonly aria-label="書き出した記録">${esc(JSON.stringify({ app: "spotter", v: 3, logs, settings, body, walks, off: offDays }))}</textarea>
          <button type="button" class="btn primary" data-act="copy-export">コピーする</button>` : ""}
        ${xfer === "import" ? `<textarea class="xfer" id="importText" placeholder="書き出した記録をここに貼り付け" aria-label="読み込む記録"></textarea>
          <button type="button" class="btn primary" data-act="import-run">読み込む</button>` : ""}
        ${pendingDelete === "all"
          ? `<div class="row-btns"><button type="button" class="btn danger" data-act="wipe-yes">すべて消す</button><button type="button" class="btn ghost" data-act="del-no">やめる</button></div>`
          : `<button type="button" class="btn danger" data-act="wipe-ask">記録と設定をすべて消す</button>`}
      </div>`;
  }

  // ── タブ ──
  function switchTab(t) {
    tab = t;
    if (t !== "log") lastSummary = null;
    pendingDelete = null;
    document.querySelectorAll(".tab").forEach((b) => {
      if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    ["menu", "log", "settings"].forEach((v) => { $("#view-" + v).hidden = v !== t; });
    if (t === "menu") renderMenu();
    if (t === "log") renderLog();
    if (t === "settings") renderSettings();
    window.scrollTo(0, 0);
  }
  // メニューを作り直す（記録中なら確認を出す）
  function requestRegen(apply) {
    if (anyDone()) { pendingRegen = apply; renderMenu(); return; }
    apply();
    rebuild();
    renderMenu();
  }
  function settingsChanged() {
    saveSettings();
    if (!anyDone()) rebuild();
  }
  function setItemWeight(it, w) {
    it.sets.forEach((x) => { if (!x.done) x.w = w; });
  }

  // ── イベント ──
  document.addEventListener("click", (e) => {
    unlockAudio();
    const t = e.target.closest("[data-act], [data-tab]");
    if (!t) return;
    if (t.dataset.tab) { switchTab(t.dataset.tab); return; }
    const act = t.dataset.act;
    const i = Number(t.dataset.i);
    const j = Number(t.dataset.j);
    switch (act) {
      case "jump": {
        const el = document.getElementById(`ex-${i}`);
        if (el) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        break;
      }
      case "cond":
        condOpen = !condOpen;
        renderMenu();
        break;
      case "dtype": {
        // 設定の「今日の内容」（筋トレ／有酸素／休む）。記録中は変えない
        if (anyDone()) { toast("記録中は変えられません"); break; }
        const v = t.dataset.v;
        rebuild(v === "auto" ? null : v);
        renderSettings();
        toast(`今日の内容：${v === "auto" ? "自動" : DAY_TYPES[v]}`);
        break;
      }
      case "walk-start":
        startWalk(); renderMenu();
        break;
      case "walk-stop":
        stopWalk(); renderMenu();
        break;
      case "walk-done":
        walks[todayIso()] = walkMin;
        saveWalks(); renderMenu();
        break;
      case "walk-undo":
        delete walks[todayIso()];
        saveWalks(); renderMenu();
        break;
      case "off-today":
        offDays[todayIso()] = true;
        saveOff(); rebuild(null); renderMenu();
        break;
      case "off-undo":
        delete offDays[todayIso()];
        saveOff(); rebuild(null); renderMenu();
        break;
      case "wp-week":
        weekOff = weekOff ? 0 : 1;
        renderMenu();
        break;
      case "show-again":
        showAgain = true;
        rebuild(cur.type === "rest" ? "strength" : cur.override);
        renderMenu();
        break;
      case "cardio-pick":
        cur.items[i].exId = t.dataset.v;
        saveCur(); renderMenu();
        break;
      case "interval":
        cur.interval = !cur.interval;
        saveCur(); renderMenu();
        break;
      case "timer-add":
        timer.end = Math.max(timer.end, Date.now()) + 30000;
        timer.total += 30;
        timer.beeped = false;
        timer.nudged = false;
        $("#timer").classList.remove("late");
        tickRest();
        break;
      case "timer-extend": {
        // 目標回数に届かなかった：この種目の休憩をこれから30秒長く
        const it = cur.items[timer.i];
        if (it) it.restExtra = (it.restExtra || 0) + 30;
        timer.end += 30000;
        timer.total += 30;
        $("#timerAsk").hidden = true;
        saveCur(); tickRest();
        if (tab === "menu") renderMenu();
        break;
      }
      case "timer-skip":
        stopRest();
        break;
      case "notify-on":
        try {
          Notification.requestPermission().then(() => renderSettings());
        } catch (err) { toast("通知を使えませんでした"); }
        break;
      case "goto-body":
        switchTab("log");
        setTimeout(() => { const el = $("#bodyrec"); if (el) el.scrollIntoView({ block: "start" }); const w = $("#inWeight"); if (w) w.focus(); }, 50);
        break;
      case "body-save": {
        const w = parseFloat($("#inWeight").value);
        if (!(w > 0)) { toast("体重を入れてください"); break; }
        const d = todayIso();
        body = body.filter((r) => r.date !== d).concat([{ date: d, weight: w }]);
        saveBody(); renderLog();
        toast("記録しました");
        break;
      }
      case "eq-toggle": {
        const v = t.dataset.v;
        requestRegen(() => { settings.equip[v] = !settings.equip[v]; saveSettings(); });
        break;
      }
      case "minutes":
        if (tab === "settings") { settings.minutes = Number(t.dataset.v); settingsChanged(); renderSettings(); break; }
        requestRegen(() => { settings.minutes = Number(t.dataset.v); saveSettings(); });
        break;
      case "regen-yes": {
        const apply = pendingRegen;
        pendingRegen = null;
        if (apply) apply();
        rebuild();
        renderMenu();
        break;
      }
      case "regen-no":
        pendingRegen = null;
        renderMenu();
        break;
      case "see-today":
        selDay = todayIso();
        calMonth = null;
        switchTab("log");
        break;
      case "period":
        logPeriod = t.dataset.v;
        renderLog();
        break;
      case "w-dec":
      case "w-inc": {
        const it = cur.items[i];
        const step = EX[it.exId].step || 1;
        const w = itemWeight(it);
        let nw;
        if (w == null) nw = act === "w-inc" ? EX[it.exId].start || step : null;
        else nw = act === "w-inc" ? w + step : Math.max(step, w - step);
        setItemWeight(it, nw == null ? null : Math.round(nw * 10) / 10);
        saveCur(); renderMenu();
        break;
      }
      case "check": {
        const st = cur.items[i].sets[j];
        st.done = !st.done;
        if (st.done && !cur.startedAt) cur.startedAt = Date.now();
        saveCur(); renderMenu();
        // セットを終えたら休憩タイマーを自動で開始（全部終わったら止める）
        if (st.done && cur.items.some((x) => x.part !== "cardio" && !itemDone(x))) startRest(i, j); else if (st.done) stopRest();
        break;
      }
      case "check-all": {
        const it = cur.items[i];
        const all = itemDone(it);
        it.sets.forEach((x) => { x.done = !all; });
        if (!all && !cur.startedAt) cur.startedAt = Date.now();
        saveCur(); renderMenu();
        if (!all && it.part !== "cardio" && cur.items.some((x) => x.part !== "cardio" && !itemDone(x))) startRest(i, it.sets.length - 1);
        break;
      }
      case "add-set": {
        const it = cur.items[i];
        const lastSet = it.sets[it.sets.length - 1];
        it.sets.push({ w: lastSet ? lastSet.w : null, r: lastSet ? lastSet.r : 10, t: lastSet ? lastSet.t : null, done: false });
        saveCur(); renderMenu();
        break;
      }
      case "del-set":
        cur.items[i].sets.pop();
        saveCur(); renderMenu();
        break;
      case "remove":
        cur.items.splice(i, 1);
        saveCur(); renderMenu();
        break;
      case "swap":
        swapItem(i);
        break;
      case "finish":
        finishSession();
        break;
      case "day":
        selDay = t.dataset.d;
        pendingDelete = null;
        lastSummary = null;
        renderLog();
        break;
      case "cal-prev":
      case "cal-next":
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (act === "cal-prev" ? -1 : 1), 1);
        renderLog();
        break;
      case "del-ask":
        pendingDelete = selDay; renderLog();
        break;
      case "del-yes":
        logs = logs.filter((s) => s.date !== selDay);
        saveLogs(); pendingDelete = null; lastSummary = null;
        if (!anyDone()) rebuild(); // 順番・目標が変わるので作り直す
        renderLog();
        break;
      case "del-no":
        pendingDelete = null;
        if (tab === "log") renderLog(); else renderSettings();
        break;
      // 記録の引っ越し（別の端末・アプリ版へ）：文字で書き出して、貼り付けて読み込む
      case "export":
        xfer = xfer === "export" ? null : "export";
        renderSettings();
        break;
      case "import-open":
        xfer = xfer === "import" ? null : "import";
        renderSettings();
        break;
      case "copy-export": {
        const ta = $(".xfer");
        ta.select();
        const done = () => toast("コピーしました。別の端末の「記録を読み込む」に貼り付けてください");
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (err) { toast("長押しでコピーしてください"); } });
        else { try { document.execCommand("copy"); done(); } catch (err) { toast("長押しでコピーしてください"); } }
        break;
      }
      case "import-run": {
        let data;
        try { data = JSON.parse($("#importText").value.trim()); } catch (err) { toast("読み込めませんでした（形式が違います）"); break; }
        if (!data || !Array.isArray(data.logs)) { toast("読み込めませんでした（記録が見つかりません）"); break; }
        // 同じ記録は重ねない（idで判定）。日付順に並べ直す
        const have = new Set(logs.map((x) => x.id));
        const add = data.logs.filter((x) => x && x.id && x.date && Array.isArray(x.items) && !have.has(x.id));
        logs = logs.concat(add).sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
        saveLogs();
        if (data.settings && data.settings.v === SETTINGS_VER && data.settings.equip) { Object.assign(settings, { equip: data.settings.equip }); saveSettings(); }
        // 体重、歩数、行けない日も（同じ日は読み込んだほうを使う）
        if (Array.isArray(data.body)) { const m = new Map(body.map((r) => [r.date, r])); data.body.forEach((r) => r && r.date && m.set(r.date, r)); body = [...m.values()]; saveBody(); }
        if (data.walks && typeof data.walks === "object") { walks = { ...walks, ...data.walks }; saveWalks(); }
        if (data.off && typeof data.off === "object") { offDays = { ...offDays, ...data.off }; saveOff(); }
        xfer = null;
        if (!anyDone()) rebuild();
        renderSettings();
        toast(`${add.length}回分の記録を読み込みました`);
        break;
      }
      case "wipe-ask":
        pendingDelete = "all"; renderSettings();
        break;
      case "wipe-yes":
        logs = [];
        offDays = {};
        walks = {};
        body = [];
        Object.assign(settings, defaultSettings());
        try { Object.values(LS).forEach((k) => localStorage.removeItem(k)); } catch (err) { /* 無視 */ }
        cur = null;
        ensureToday();
        pendingDelete = null;
        renderSettings();
        toast("すべて消しました");
        break;
      default:
        break;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    const act = t.dataset && t.dataset.act;
    if (!act) return;
    const i = Number(t.dataset.i);
    const j = Number(t.dataset.j);
    if (act === "w-all") {
      setItemWeight(cur.items[i], t.value === "" ? null : Number(t.value));
      saveCur(); renderMenu();
      return;
    }
    if (act === "set-r") {
      cur.items[i].sets[j].r = Number(t.value);
      saveCur();
      return;
    }
    if (act === "walk-m") {
      walkMin = Number(t.value);
      renderMenu();
      return;
    }
    if (act === "set-m") {
      cur.items[i].sets[0].m = Number(t.value);
      saveCur(); renderMenu();
      return;
    }

    if (act === "equip") {
      settings.equip[t.dataset.v] = t.checked;
      settingsChanged();
    }
  });

  // 開いたまま日付が変わったら、今日のメニューに切り替える（画面に戻った時と1分ごとに確認）
  let shownDay = todayIso();
  function checkDayChange() {
    const d = todayIso();
    if (d === shownDay) return;
    shownDay = d;
    ensureToday();
    selDay = null;
    calMonth = null;
    stopRest();
    switchTab(tab);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDayChange(); });
  window.addEventListener("focus", checkDayChange);
  setInterval(() => { checkDayChange(); checkSteps(); }, 60000);

  // 起動
  ensureToday();
  renderMenu();
  // 起動時のロゴ：1.8秒（動きを減らす設定の時は0.6秒）で消える。押すとすぐ消える
  const splash = $("#splash");
  if (splash) {
    let gone = false;
    const hide = () => {
      if (gone) return;
      gone = true;
      splash.classList.add("hide");
      setTimeout(() => splash.remove(), 500);
    };
    const quiet = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(hide, quiet ? 600 : 1800);
    splash.addEventListener("click", hide);
  }
})();
</script>
<script>
  // アプリ版：一度開けば電波がなくても動くように（https か手元の確認用 localhost で開いた時だけ）
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
