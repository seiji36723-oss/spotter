# main に変更が入るたびに Android アプリ（APK）を作って、「Releases」に置く
name: Android アプリを作る
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: アプリの中身（index.html）を入れる
        run: cp index.html android/app/src/main/assets/index.html
      - name: 署名の鍵を用意（Secrets にある時だけ）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spotter.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/spotter.jks" >> "$GITHUB_ENV"
          fi
      - name: APK を作る
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: gradle -p android assembleRelease
      - name: 名前をそろえる
        run: cp android/app/build/outputs/apk/release/app-release.apk SPOTTER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SPOTTER-apk
          path: SPOTTER.apk
      - name: Releases に置く（いつも最新の1つ）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SPOTTER 最新版
          body: Android のスマホでこの SPOTTER.apk をダウンロードして開くと入れられます。
          files: SPOTTER.apk
          make_latest: true
